
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滾球進圈圈得分遊戲</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  text-align: center;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(#1685dc, #092b50);
}

h1 { font-size: 25px; margin: 8px 0; }

#status {
  color: #ffe082;
  margin: 12px;
  font-size: 14px;
}

#scores {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin: 12px;
  font-size: 17px;
}

.score {
  font-size: 28px;
  font-weight: bold;
  color: #ffe082;
}

#arena {
  position: relative;
  width: min(90vw, 390px);
  height: min(65vh, 510px);
  min-height: 350px;
  margin: 16px auto;
  overflow: hidden;
  border: 6px solid #c5d6e7;
  border-radius: 24px;
  background:
    repeating-linear-gradient(
      0deg,
      #54c889 0px,
      #54c889 65px,
      #46b879 65px,
      #46b879 130px
    );
  box-shadow: 0 10px 25px #00182d70;
}

#arena::before {
  content: "";
  position: absolute;
  left: 8%;
  top: 0;
  height: 100%;
  width: 84%;
  border-left: 5px solid #b9d0e4;
  border-right: 5px solid #b9d0e4;
  pointer-events: none;
}

.label {
  position: absolute;
  z-index: 1;
  color: white;
  font-size: 13px;
  font-weight: bold;
  text-shadow: 0 1px 4px #234;
}

.top { top: 8px; left: 50%; transform: translateX(-50%); }
.bottom { bottom: 8px; left: 50%; transform: translateX(-50%); }
.left { left: 10px; top: 50%; transform: translateY(-50%); }
.right { right: 10px; top: 50%; transform: translateY(-50%); }

#target {
  position: absolute;
  z-index: 2;
  width: 76px;
  height: 76px;
  border: 9px solid #ffcf33;
  border-radius: 50%;
  background: #ffed8930;
  box-shadow:
    0 0 0 3px #fff4b5,
    0 0 18px #ffcf33a0,
    inset 0 0 10px #ffcf3370;
  transform: translate(-50%, -50%);
}

#ball {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 83%;
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 25%,
    #ffffff,
    #55c8ff 30%,
    #0783ee 62%,
    #064ba7
  );
  box-shadow: 0 5px 10px #003d4060;
  transform: translate(-50%, -50%);
}

#message {
  min-height: 28px;
  color: #ffe082;
  font-weight: bold;
  font-size: 18px;
}

button {
  padding: 12px 17px;
  margin: 5px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#start { background: #ffcf33; color: #17324d; }
#reset { background: white; color: #17324d; }

.note {
  color: #d9ecff;
  font-size: 13px;
  line-height: 1.8;
}
</style>
</head>

<body>
<h1>🎯 滾球進圈圈</h1>
<div id="status">正在連接 MQTT……</div>

<div id="scores">
  <div>目前分數<br><span class="score" id="score">0</span></div>
  <div>最高分<br><span class="score" id="best">0</span></div>
</div>

<div id="arena">
  <span class="label top">前方</span>
  <span class="label bottom">後方</span>
  <span class="label left">左</span>
  <span class="label right">右</span>
  <div id="target"></div>
  <div id="ball"></div>
</div>

<div id="message">把球滾進金色圈圈即可得分！</div>
<p class="note">
  往前傾：球往前｜往後仰：球往後<br>
  往左傾：球往左｜往右傾：球往右
</p>

<button id="start">開始／允許感測器</button>
<button id="reset">重新開始</button>

<script>
(() => {
  const topic = "nutc/im/1411331040/game/ball";
  const mode = new URLSearchParams(location.search).get("mode") === "pc"
    ? "pc" : "phone";

  const arena = document.getElementById("arena");
  const ball = document.getElementById("ball");
  const target = document.getElementById("target");
  const status = document.getElementById("status");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const message = document.getElementById("message");

  let client;
  let x = 50, y = 83;
  let tx = 50, ty = 18;
  let vx = 0, vy = 0;
  let pitch = 0, roll = 0;
  let baseBeta = null, baseGamma = null;
  let started = false;
  let score = 0, best = 0;
  let lastTime = 0, lastSend = 0;
  let lastGoal = 0;
  let goalFlashUntil = 0;

  document.getElementById("start").style.display =
    mode === "pc" ? "none" : "inline-block";

  function draw() {
    ball.style.left = x + "%";
    ball.style.top = y + "%";
    target.style.left = tx + "%";
    target.style.top = ty + "%";
  }

  function updateScore() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function randomTarget() {
    // 讓圈圈出現在球場中央範圍內，避免貼邊
    tx = 22 + Math.random() * 56;
    ty = 16 + Math.random() * 65;
    draw();
  }

  function resetGame(send = true) {
    x = 50; y = 83;
    vx = 0; vy = 0;
    score = 0;
    lastGoal = 0;
    randomTarget();
    updateScore();
    message.textContent = "把球滾進金色圈圈即可得分！";
    draw();

    if (send && mode === "phone" && client?.connected) {
      publishState();
    }
  }

  function publishState() {
    if (!client?.connected) return;
    client.publish(topic, JSON.stringify({
      x, y, tx, ty, score, best,
      p: pitch, r: roll,
      reset: false,
      time: Date.now()
    }));
  }

  function connect() {
    client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

    client.on("connect", () => {
      status.textContent = "MQTT 已連線 ✓";
      if (mode === "pc") {
        client.subscribe(topic, err => {
          status.textContent = err
            ? "訂閱失敗"
            : "PC 已連線，等待手機遊戲同步……";
        });
      } else {
        status.textContent = "手機已連線，可以開始遊戲";
      }
    });

    client.on("error", () => {
      status.textContent = "MQTT 連線錯誤，請檢查網路";
    });

    client.on("offline", () => {
      status.textContent = "MQTT 離線，重新連線中……";
    });

    client.on("message", (receivedTopic, raw) => {
      if (mode !== "pc" || receivedTopic !== topic) return;

      try {
        const d = JSON.parse(raw.toString());

        if (Number.isFinite(d.x)) x = d.x;
        if (Number.isFinite(d.y)) y = d.y;
        if (Number.isFinite(d.tx)) tx = d.tx;
        if (Number.isFinite(d.ty)) ty = d.ty;

        if (Number.isFinite(d.score)) score = d.score;
        if (Number.isFinite(d.best)) best = d.best;

        scoreEl.textContent = score;
        bestEl.textContent = best;
        draw();

        if (d.reset) message.textContent = "遊戲已重新開始！";
        else if (score > 0) message.textContent = "繼續挑戰下一個圈圈！";
        else message.textContent = "等待手機控制球……";
      } catch (e) {}
    });
  }

  function orientationHandler(e) {
    if (!started || mode !== "phone") return;
    if (e.beta == null || e.gamma == null) return;

    if (baseBeta === null) {
      baseBeta = e.beta;
      baseGamma = e.gamma;
    }

    pitch = Math.max(-35, Math.min(35, e.beta - baseBeta));
    roll = Math.max(-35, Math.min(35, e.gamma - baseGamma));
  }

  function checkGoal(time) {
    const dx = x - tx;
    const dy = y - ty;

    // 球接近圈圈中心就得分，避免球必須像素級精準
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 9 && time - lastGoal > 1000) {
      lastGoal = time;
      score += 1;
      best = Math.max(best, score);
      updateScore();

      message.textContent = "🎉 得分！ +1";
      goalFlashUntil = time + 650;

      // 球留在附近短暫顯示得分，再把圈圈移到新位置
      randomTarget();

      if (client?.connected) publishState();
    }
  }

  function animate(time) {
    requestAnimationFrame(animate);

    if (mode !== "phone" || !started) return;

    const dt = lastTime
      ? Math.min((time - lastTime) / 1000, 0.05)
      : 0;
    lastTime = time;

    // 傾斜角度控制球的兩個方向
    vx += roll * 2.0 * dt;
    vy += pitch * 2.0 * dt;

    const friction = Math.pow(0.90, dt * 10);
    vx *= friction;
    vy *= friction;

    x += vx * dt;
    y += vy * dt;

    // 場地邊界
    if (x < 12) { x = 12; vx = 0; }
    if (x > 88) { x = 88; vx = 0; }
    if (y < 6) { y = 6; vy = 0; }
    if (y > 94) { y = 94; vy = 0; }

    checkGoal(time);
    draw();

    if (time - goalFlashUntil > 0 && time - goalFlashUntil < 80) {
      // 得分文字由下一次狀態更新取代
    }

    if (client?.connected && time - lastSend > 50) {
      lastSend = time;
      publishState();
    }
  }

  document.getElementById("start").addEventListener("click", async () => {
    if (mode !== "phone") return;

    if (!("DeviceOrientationEvent" in window)) {
      status.textContent = "此裝置不支援方向感測器";
      return;
    }

    try {
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") {
          status.textContent = "感測器未獲允許，請檢查 Safari 設定";
          return;
        }
      }

      baseBeta = null;
      baseGamma = null;
      started = true;
      window.addEventListener("deviceorientation", orientationHandler);
      status.textContent = "感測器已啟動！傾斜手機控制球";
      message.textContent = "開始！把球滾進金色圈圈！";
    } catch (err) {
      status.textContent = "啟動失敗：" + err.message;
    }
  });

  document.getElementById("reset").addEventListener("click", () => {
    resetGame();

    if (mode === "phone" && client?.connected) {
      client.publish(topic, JSON.stringify({
        x, y, tx, ty, score, best,
        p: 0, r: 0, reset: true, time: Date.now()
      }));
    }
  });

  connect();
  draw();
  updateScore();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
