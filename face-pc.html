
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC 人臉辨識監控</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
body{font-family:Arial;background:#edf2f7;margin:0;padding:20px;color:#222}
.card{background:white;padding:18px;border-radius:12px;margin:12px auto;max-width:1000px}
.status{padding:10px;background:#eef4fa;border-radius:7px;margin:8px 0}
.stage{position:relative;background:#111;width:100%;min-height:300px;overflow:hidden}
.stage canvas{width:100%;height:100%;display:block}
.person{padding:10px;border-bottom:1px solid #ddd}
.green{color:green}
.red{color:#bd3434}
</style>
</head>
<body>

<div class="card">
<h2>人臉辨識即時監控系統</h2>
<div class="status" id="mqttStatus">正在連線 MQTT...</div>
<div class="status" id="deviceStatus">等待手機連線...</div>
<div class="status" id="count">目前偵測人數：0</div>
</div>

<div class="card">
<h3>手機即時人臉畫面外框</h3>
<div class="stage">
<canvas id="canvas"></canvas>
</div>
</div>

<div class="card">
<h3>目前辨識人員</h3>
<div id="currentPeople">尚未收到辨識資料</div>
</div>

<div class="card">
<h3>辨識紀錄</h3>
<div id="logs"></div>
</div>

<script>
const TOPIC='classroom/face-demo-2026/demo01';
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

let lastFaces=[];
let lastFrame={width:1280,height:720};
let currentDevice='';

const client=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{
 clientId:'facePC_'+Math.random().toString(16).slice(2),
 reconnectPeriod:3000
});

function log(text){
 const d=document.createElement('div');
 d.className='person';
 d.textContent=new Date().toLocaleString()+'　'+text;
 document.getElementById('logs').prepend(d);
}

client.on('connect',()=>{
 document.getElementById('mqttStatus').textContent='✅ MQTT 已連線';
 client.subscribe(TOPIC);
});

client.on('reconnect',()=>{
 document.getElementById('mqttStatus').textContent='MQTT 重新連線中...';
});

client.on('error',e=>{
 document.getElementById('mqttStatus').textContent='MQTT 錯誤：'+e.message;
});

client.on('message',(topic,message)=>{
 let data;
 try{data=JSON.parse(message.toString())}
 catch(e){return}

 if(data.type==='phone_status'){
  currentDevice=data.deviceId||'手機';
  document.getElementById('deviceStatus').textContent=
   data.online?'🟢 手機已連線：'+currentDevice:'🔴 手機已離線：'+currentDevice;
 }

 if(data.type==='face_results'){
  lastFaces=data.faces||[];
  lastFrame=data.frame||lastFrame;
  draw();
  showCurrent();
  document.getElementById('count').textContent=
   '目前偵測人數：'+lastFaces.length;
 }

 if(data.type==='face_event'){
  log(
   '辨識到 '+data.name+
   '｜裝置：'+data.deviceId+
   '｜特徵距離：'+data.distance+
   '｜時間：'+new Date(data.recognizedAt).toLocaleTimeString()
  );
 }
});

function draw(){
 const w=lastFrame.width||1280;
 const h=lastFrame.height||720;

 canvas.width=w;
 canvas.height=h;
 ctx.clearRect(0,0,w,h);

 // PC 不接收照片，只顯示手機傳來的外框座標
 lastFaces.forEach(f=>{
  const b=f.bbox;
  const x=b.x*w,y=b.y*h,bw=b.width*w,bh=b.height*h;

  ctx.strokeStyle=f.recognized?'#00e676':'#ff3333';
  ctx.lineWidth=Math.max(3,w/250);
  ctx.strokeRect(x,y,bw,bh);

  const label=f.name;
  ctx.font='bold '+Math.max(18,w/40)+'px Arial';
  const tw=ctx.measureText(label).width;

  ctx.fillStyle=f.recognized?'#168b48':'#bd3434';
  ctx.fillRect(x,Math.max(0,y-32),tw+16,30);
  ctx.fillStyle='white';
  ctx.fillText(label,x+8,Math.max(22,y-10));
 });
}

function showCurrent(){
 const box=document.getElementById('currentPeople');
 box.innerHTML='';

 if(!lastFaces.length){
  box.textContent='目前沒有偵測到人臉';
  return;
 }

 lastFaces.forEach(f=>{
  const d=document.createElement('div');
  d.className='person';
  d.textContent=
   (f.recognized?'✅ ':'❓ ')+
   f.name+
   (f.distance!==null?'｜距離：'+f.distance:'');
  box.append(d);
 });
}
</script>
</body>
</html>
