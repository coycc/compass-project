
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三次作業－地震警報儀</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, "Noto Sans TC", sans-serif;
  background: #101827;
  color: white;
}

.container {
  max-width: 520px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 25px;
}

.card {
  background: #1d2a40;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 16px;
}

.status {
  padding: 12px;
  background: #34445e;
  border-radius: 8px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.box {
  background: #293b58;
  border-radius: 10px;
  padding: 13px 5px;
  text-align: center;
}

.value {
  display: block;
  color: #73c7ff;
  font-size: 23px;
  font-weight: bold;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.total {
  text-align: center;
  font-size: 36px;
  font-weight: bold;
  color: #43e0a1;
  margin: 15px 0;
}

.alarm {
  border: 2px solid #27875c;
  background: #173d32;
  padding: 25px 10px;
  text-align: center;
  border-radius: 12px;
}

.alarm.active {
  border-color: #ff3333;
  background: #781c27;
  animation: flash 0.5s infinite alternate;
}

.alarm-title {
  font-size: 27px;
  font-weight: bold;
}

.alarm-text {
  margin-top: 12px;
  font-size: 15px;
}

@keyframes flash {
  from { background: #781c27; }
  to { background: #bc2020; }
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.start { background: #20bb80; color: white; }
.stop { background: #e45d5d; color: white; }

.small {
  color: #bdc9db;
  font-size: 13px;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}
</style>
</head>

<body>
<div class="container">

<h1>🚨 地震警報儀</h1>

<div class="card">
  <div class="status" id="mqttStatus">MQTT 連線中...</div>
  <p class="small">MQTT Topic：classroom/earthquake/phone01</p>
</div>

<div class="card">
  <h2>📱 手機加速度</h2>

  <div class="grid">
    <div class="box">
      X 軸
      <span class="value" id="x">0.00</span>
    </div>
    <div class="box">
      Y 軸
      <span class="value" id="y">0.00</span>
    </div>
    <div class="box">
      Z 軸
      <span class="value" id="z">0.00</span>
    </div>
  </div>

  <p style="text-align:center">總加速度</p>
  <div class="total" id="total">0.00 m/s²</div>
</div>

<div class="card">
  <h2>🚨 地震警報狀態</h2>

  <div class="alarm" id="alarmPanel">
    <div class="alarm-title" id="alarmStatus">🟢 目前正常</div>
    <div class="alarm-text" id="alarmMessage">
      尚未偵測到異常震動
    </div>
  </div>

  <p class="small">
    警報門檻：0.80 m/s²<br>
    超過門檻並持續 0.2 秒觸發警報。
  </p>
</div>

<div class="card">
  <h2>⚙️ 裝置設定</h2>

  <label for="deviceId">裝置 ID</label>
  <input id="deviceId" value="phone01">

  <button id="soundBtn" style="background:#44628b;color:white">
    🔊 警報聲：開啟
  </button>
</div>

<div class="card">
  <h2>🎮 操作</h2>
  <button class="start" id="startBtn">▶ 開始地震監測</button>
  <button class="stop" id="stopBtn">⏹ 停止監測</button>
  <p class="small" id="sensorStatus">感測器尚未啟動</p>
</div>

</div>

<script>
// =====================================
// 1. MQTT 設定
// =====================================

const MQTT_URL = "wss://broker.hivemq.com:8884/mqtt";
const TOPIC = "classroom/earthquake/phone01";

let mqttClient = null;
let tracking = false;

const mqttStatus = document.getElementById("mqttStatus");

function connectMQTT() {
  mqttClient = mqtt.connect(MQTT_URL, {
    clientId: "earthquake_phone_" +
      Math.random().toString(16).slice(2),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  mqttClient.on("connect", () => {
    mqttStatus.textContent = "✅ MQTT 已連線";
    mqttStatus.style.background = "#176b50";
  });

  mqttClient.on("reconnect", () => {
    mqttStatus.textContent = "正在重新連線...";
  });

  mqttClient.on("offline", () => {
    mqttStatus.textContent = "MQTT 離線";
    mqttStatus.style.background = "#803737";
  });

  mqttClient.on("error", error => {
    console.error(error);
    mqttStatus.textContent = "MQTT 連線錯誤";
  });
}

connectMQTT();

function publish(data) {
  if (mqttClient && mqttClient.connected) {
    mqttClient.publish(TOPIC, JSON.stringify(data));
  }
}

function getDeviceId() {
  return document.getElementById("deviceId").value.trim() || "phone01";
}

function sendData(type, active, x = 0, y = 0, z = 0, total = 0) {
  publish({
    type: type,
    active: active,
    x: Number(x.toFixed(3)),
    y: Number(y.toFixed(3)),
    z: Number(z.toFixed(3)),
    total: Number(total.toFixed(3)),
    threshold: THRESHOLD,
    device_id: getDeviceId(),
    timestamp: new Date().toISOString(),
    unit: "m/s2"
  });
}

// =====================================
// 2. 地震警報設定
// =====================================

const THRESHOLD = 0.8;
const RESET_THRESHOLD = 0.52;

let alarmActive = false;
let highSince = null;
let lowSince = null;

let gravity = null;
let lastSensorTime = 0;
let lastPublishTime = 0;

// =====================================
// 3. 警報音效
// =====================================

let audioContext = null;
let soundEnabled = true;
let soundTimer = null;

async function prepareAudio() {
  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) return;

  if (!audioContext) {
    audioContext = new AudioContextClass();
  }

  if (audioContext.state === "suspended") {
    await audioContext.resume();
  }
}

function beep() {
  if (!soundEnabled || !audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sawtooth";
  oscillator.frequency.value = 880;

  gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.18, audioContext.currentTime + 0.03
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001, audioContext.currentTime + 0.25
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.27);
}

function startAlarmSound() {
  if (!soundEnabled || soundTimer) return;

  beep();
  soundTimer = setInterval(beep, 550);

  // 支援震動的手機才會執行
  if (navigator.vibrate) {
    navigator.vibrate([300, 150, 300, 150]);
  }
}

function stopAlarmSound() {
  clearInterval(soundTimer);
  soundTimer = null;

  if (navigator.vibrate) {
    navigator.vibrate(0);
  }
}

// =====================================
// 4. 更新警報畫面
// =====================================

function updateAlarm(active, total) {
  const panel = document.getElementById("alarmPanel");
  const status = document.getElementById("alarmStatus");
  const message = document.getElementById("alarmMessage");

  document.getElementById("total").textContent =
    total.toFixed(2) + " m/s²";

  if (active) {
    panel.classList.add("active");
    status.textContent = "🚨 偵測到強烈震動！";
    message.textContent = "加速度超過警報門檻，請注意安全！";
  } else {
    panel.classList.remove("active");
    status.textContent = "🟢 目前正常";
    message.textContent = "尚未偵測到超過門檻的震動";
  }
}

function triggerAlarm(total) {
  if (alarmActive) return;

  alarmActive = true;
  lowSince = null;

  updateAlarm(true, total);
  startAlarmSound();

  sendData("alarm", true, lastX, lastY, lastZ, total);
}

function clearAlarm(total) {
  if (!alarmActive) return;

  alarmActive = false;
  highSince = null;

  updateAlarm(false, total);
  stopAlarmSound();

  sendData("clear", false, lastX, lastY, lastZ, total);
}

// =====================================
// 5. 讀取加速度
// =====================================

let lastX = 0;
let lastY = 0;
let lastZ = 0;

function validXYZ(value) {
  return value &&
    Number.isFinite(value.x) &&
    Number.isFinite(value.y) &&
    Number.isFinite(value.z);
}

function handleMotion(event) {
  if (!tracking) return;

  const now = Date.now();

  const dt = lastSensorTime
    ? Math.max(0.005, Math.min((now - lastSensorTime) / 1000, 0.2))
    : 0.02;

  lastSensorTime = now;

  let x, y, z;

  // 優先採用不含重力的線性加速度
  if (validXYZ(event.acceleration)) {
    x = event.acceleration.x;
    y = event.acceleration.y;
    z = event.acceleration.z;

    document.getElementById("sensorStatus").textContent =
      "✅ 使用手機線性加速度";

  } else if (validXYZ(event.accelerationIncludingGravity)) {
    // 沒有線性加速度時，估算並扣除重力
    const raw = event.accelerationIncludingGravity;
    const alpha = 1 - Math.exp(-dt / 0.8);

    if (gravity === null) {
      gravity = { x: raw.x, y: raw.y, z: raw.z };
    } else {
      gravity.x += alpha * (raw.x - gravity.x);
      gravity.y += alpha * (raw.y - gravity.y);
      gravity.z += alpha * (raw.z - gravity.z);
    }

    x = raw.x - gravity.x;
    y = raw.y - gravity.y;
    z = raw.z - gravity.z;

    document.getElementById("sensorStatus").textContent =
      "✅ 使用估算方式扣除重力";

  } else {
    document.getElementById("sensorStatus").textContent =
      "⚠️ 未取得有效加速度資料";
    return;
  }

  // 計算總加速度
  const total = Math.sqrt(x*x + y*y + z*z);

  lastX = x;
  lastY = y;
  lastZ = z;

  document.getElementById("x").textContent = x.toFixed(2);
  document.getElementById("y").textContent = y.toFixed(2);
  document.getElementById("z").textContent = z.toFixed(2);

  // 每 100ms 傳送一次監測資料
  if (now - lastPublishTime >= 100) {
    sendData("reading", alarmActive, x, y, z, total);
    lastPublishTime = now;
  }

  // ===================================
  // 6. 判斷是否觸發地震警報
  // ===================================

  if (!alarmActive) {
    if (total > THRESHOLD) {
      if (highSince === null) {
        highSince = now;
      }

      // 持續超過門檻 200ms 才觸發
      if (now - highSince >= 200) {
        triggerAlarm(total);
      }
    } else {
      highSince = null;
    }

  } else {
    if (total < RESET_THRESHOLD) {
      if (lowSince === null) {
        lowSince = now;
      }

      // 持續低於解除門檻 1.5 秒才解除
      if (now - lowSince >= 1500) {
        clearAlarm(total);
      }
    } else {
      lowSince = null;
    }
  }
}

// =====================================
// 7. 開始監測
// =====================================

async function startMonitoring() {
  if (tracking) return;

  if (!window.isSecureContext) {
    alert("請使用 HTTPS 網址開啟本程式。");
    return;
  }

  if (!("DeviceMotionEvent" in window)) {
    alert("此瀏覽器不支援手機動作感測器。");
    return;
  }

  try {
    await prepareAudio();

    // iPhone Safari 必須按鈕觸發權限申請
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      const permission =
        await DeviceMotionEvent.requestPermission();

      if (permission !== "granted") {
        alert("請允許動作與方向感測器權限。");
        return;
      }
    }

    gravity = null;
    lastSensorTime = 0;
    lastPublishTime = 0;
    highSince = null;
    lowSince = null;

    tracking = true;

    window.addEventListener("devicemotion", handleMotion, true);

    document.getElementById("sensorStatus").textContent =
      "正在監測手機加速度...";

    publish({
      type: "start",
      active: false,
      threshold: THRESHOLD,
      device_id: getDeviceId(),
      timestamp: new Date().toISOString()
    });

  } catch (error) {
    console.error(error);
    alert("啟動失敗：" + error.message);
  }
}

// =====================================
// 8. 停止監測
// =====================================

function stopMonitoring() {
  if (!tracking) return;

  tracking = false;

  window.removeEventListener("devicemotion", handleMotion, true);

  stopAlarmSound();

  if (alarmActive) {
    alarmActive = false;
    sendData("stop", false, lastX, lastY, lastZ, 0);
  } else {
    publish({
      type: "stop",
      active: false,
      device_id: getDeviceId(),
      timestamp: new Date().toISOString()
    });
  }

  highSince = null;
  lowSince = null;

  updateAlarm(false, 0);

  document.getElementById("sensorStatus").textContent =
    "監測已停止";
}

// =====================================
// 9. 音效按鈕
// =====================================

document.getElementById("soundBtn").addEventListener("click", async () => {
  soundEnabled = !soundEnabled;

  const button = document.getElementById("soundBtn");

  button.textContent = soundEnabled
    ? "🔊 警報聲：開啟"
    : "🔇 警報聲：關閉";

  if (soundEnabled) {
    await prepareAudio();

    if (alarmActive) startAlarmSound();
  } else {
    stopAlarmSound();
  }
});

document.getElementById("startBtn")
  .addEventListener("click", startMonitoring);

document.getElementById("stopBtn")
  .addEventListener("click", stopMonitoring);

</script>
</body>
</html>
