
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三次作業－地震警報儀</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, "Noto Sans TC", sans-serif;
  background: #101827;
  color: white;
}

.container {
  max-width: 520px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 25px;
}

.card {
  background: #1d2a40;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 16px;
}

.status {
  padding: 12px;
  background: #34445e;
  border-radius: 8px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.box {
  background: #293b58;
  border-radius: 10px;
  padding: 13px 5px;
  text-align: center;
}

.value {
  display: block;
  color: #73c7ff;
  font-size: 23px;
  font-weight: bold;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.total {
  text-align: center;
  font-size: 36px;
  font-weight: bold;
  color: #43e0a1;
  margin: 15px 0;
  overflow-wrap: anywhere;
}

.alarm {
  border: 2px solid #27875c;
  background: #173d32;
  padding: 25px 10px;
  text-align: center;
  border-radius: 12px;
}

.alarm.active {
  border-color: #ff3333;
  background: #781c27;
  animation: flash 0.5s infinite alternate;
}

.alarm-title {
  font-size: 27px;
  font-weight: bold;
}

.alarm-text {
  margin-top: 12px;
  font-size: 15px;
}

@keyframes flash {
  from { background: #781c27; }
  to { background: #bc2020; }
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #20bb80;
  color: white;
}

.stop {
  background: #e45d5d;
  color: white;
}

.sound {
  background: #44628b;
  color: white;
}

.small {
  color: #bdc9db;
  font-size: 13px;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚨 地震警報儀</h1>

<div class="card">
  <div class="status" id="mqttStatus">
    MQTT 連線中...
  </div>

  <p class="small">
    MQTT Topic：classroom/earthquake/phone01
  </p>
</div>

<div class="card">
  <h2>📱 手機加速度</h2>

  <div class="grid">

    <div class="box">
      X 軸
      <span class="value" id="x">0.00</span>
    </div>

    <div class="box">
      Y 軸
      <span class="value" id="y">0.00</span>
    </div>

    <div class="box">
      Z 軸
      <span class="value" id="z">0.00</span>
    </div>

  </div>

  <p style="text-align:center">總加速度</p>

  <div class="total" id="total">
    0.00 m/s²
  </div>
</div>

<div class="card">
  <h2>🚨 地震警報狀態</h2>

  <div class="alarm" id="alarmPanel">

    <div class="alarm-title" id="alarmStatus">
      🟢 目前正常
    </div>

    <div class="alarm-text" id="alarmMessage">
      尚未偵測到異常震動
    </div>

  </div>

  <p class="small">
    警報門檻：0.80 m/s²<br>
    解除門檻：0.52 m/s²
  </p>

  <p class="small" id="sensorStatus">
    感測器尚未啟動
  </p>
</div>

<div class="card">
  <h2>⚙️ 裝置設定</h2>

  <label for="deviceId">裝置 ID</label>

  <input
    id="deviceId"
    value="phone01"
    maxlength="40"
  >

  <button class="sound" id="soundBtn">
    🔇 警報聲：尚未啟用
  </button>

  <p class="small">
    請先按下警報聲按鈕，允許瀏覽器播放聲音。
  </p>
</div>

<div class="card">
  <h2>🎮 操作</h2>

  <button class="start" id="startBtn">
    ▶ 開始地震監測
  </button>

  <button class="stop" id="stopBtn">
    ⏹ 停止監測
  </button>

  <p class="small" id="trackingStatus">
    目前狀態：尚未開始
  </p>
</div>

</div>

<script>

// =====================================
// 1. MQTT 設定
// =====================================

const MQTT_URL =
  "wss://broker.hivemq.com:8884/mqtt";

const TOPIC =
  "classroom/earthquake/phone01";

let mqttClient = null;

const mqttStatus =
  document.getElementById("mqttStatus");

function connectMQTT() {

  if (typeof mqtt === "undefined") {
    mqttStatus.textContent =
      "MQTT 程式載入失敗，請檢查網路";
    return;
  }

  mqttClient = mqtt.connect(MQTT_URL, {
    clientId:
      "earthquake_phone_" +
      Math.random().toString(16).slice(2),

    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  mqttClient.on("connect", () => {
    mqttStatus.textContent = "✅ MQTT 已連線";
    mqttStatus.style.background = "#176b50";
  });

  mqttClient.on("reconnect", () => {
    mqttStatus.textContent = "MQTT 正在重新連線...";
    mqttStatus.style.background = "#80642b";
  });

  mqttClient.on("offline", () => {
    mqttStatus.textContent = "MQTT 已離線";
    mqttStatus.style.background = "#803737";
  });

  mqttClient.on("error", error => {
    console.error("MQTT 錯誤：", error);
    mqttStatus.textContent = "MQTT 連線錯誤";
  });
}

connectMQTT();

// =====================================
// 2. 基本變數
// =====================================

const THRESHOLD = 0.8;
const RESET_THRESHOLD = 0.52;

let tracking = false;
let starting = false;

let alarmActive = false;

let gravity = null;

let lastSensorTime = 0;
let lastPublishTime = 0;
let lastSensorEventTime = 0;

let highSince = null;
let lowSince = null;

let lastX = 0;
let lastY = 0;
let lastZ = 0;
let lastTotal = 0;

let noSensorTimer = null;

// =====================================
// 3. 裝置 ID
// =====================================

function getDeviceId() {

  return document.getElementById("deviceId")
    .value.trim() || "phone01";

}

// =====================================
// 4. 傳送 MQTT 資料
// =====================================

function publishData(type, active, x, y, z, total) {

  if (!mqttClient || !mqttClient.connected) {
    return;
  }

  const data = {

    type: type,

    active: active,

    x: Number(x.toFixed(3)),
    y: Number(y.toFixed(3)),
    z: Number(z.toFixed(3)),

    total: Number(total.toFixed(3)),

    threshold: THRESHOLD,

    device_id: getDeviceId(),

    timestamp: new Date().toISOString(),

    unit: "m/s2"

  };

  mqttClient.publish(
    TOPIC,
    JSON.stringify(data)
  );

}

// =====================================
// 5. 警報聲音
// =====================================

let audioContext = null;
let soundEnabled = false;
let soundTimer = null;

async function enableAudio() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContextClass) {
    alert("此瀏覽器不支援警報音效。");
    return;
  }

  try {

    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    soundEnabled = true;

    document.getElementById("soundBtn").textContent =
      "🔊 警報聲：已啟用";

    if (alarmActive) {
      startAlarmSound();
    }

  } catch (error) {

    console.error("音效初始化失敗：", error);

    alert("音效啟用失敗：" + error.message);

  }

}

function beep() {

  if (!soundEnabled || !audioContext) {
    return;
  }

  if (audioContext.state !== "running") {
    return;
  }

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = "sawtooth";
  oscillator.frequency.value = 880;

  gain.gain.setValueAtTime(
    0.0001,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.18,
    audioContext.currentTime + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioContext.currentTime + 0.25
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.27
  );

}

function startAlarmSound() {

  if (!soundEnabled || soundTimer) {
    return;
  }

  beep();

  soundTimer = setInterval(beep, 550);

  if (navigator.vibrate) {
    navigator.vibrate([300, 150, 300, 150]);
  }

}

function stopAlarmSound() {

  clearInterval(soundTimer);
  soundTimer = null;

  if (navigator.vibrate) {
    navigator.vibrate(0);
  }

}

// =====================================
// 6. 更新警報畫面
// =====================================

function updateAlarm(active, total) {

  const panel =
    document.getElementById("alarmPanel");

  const status =
    document.getElementById("alarmStatus");

  const message =
    document.getElementById("alarmMessage");

  document.getElementById("total").textContent =
    total.toFixed(2) + " m/s²";

  if (active) {

    panel.classList.add("active");

    status.textContent =
      "🚨 偵測到強烈震動！";

    message.textContent =
      "加速度超過警報門檻，請注意安全！";

  } else {

    panel.classList.remove("active");

    status.textContent =
      "🟢 目前正常";

    message.textContent =
      "尚未偵測到超過門檻的震動";

  }

}

// =====================================
// 7. 觸發警報
// =====================================

function triggerAlarm(total) {

  if (alarmActive) return;

  alarmActive = true;
  lowSince = null;

  updateAlarm(true, total);

  startAlarmSound();

  publishData(
    "alarm",
    true,
    lastX,
    lastY,
    lastZ,
    total
  );

}

// =====================================
// 8. 解除警報
// =====================================

function clearAlarm(total) {

  if (!alarmActive) return;

  alarmActive = false;
  highSince = null;

  updateAlarm(false, total);

  stopAlarmSound();

  publishData(
    "clear",
    false,
    lastX,
    lastY,
    lastZ,
    total
  );

}

// =====================================
// 9. 檢查 XYZ 資料
// =====================================

function validXYZ(value) {

  return value &&
    Number.isFinite(value.x) &&
    Number.isFinite(value.y) &&
    Number.isFinite(value.z);

}

// =====================================
// 10. 處理手機加速度
// =====================================

function handleMotion(event) {

  if (!tracking) return;

  const now = Date.now();

  const dt = lastSensorTime
    ? Math.max(
        0.005,
        Math.min((now - lastSensorTime) / 1000, 0.2)
      )
    : 0.02;

  lastSensorTime = now;
  lastSensorEventTime = now;

  let x, y, z;

  // 優先使用不含重力的線性加速度
  if (validXYZ(event.acceleration)) {

    x = event.acceleration.x;
    y = event.acceleration.y;
    z = event.acceleration.z;

    document.getElementById("sensorStatus").textContent =
      "✅ 使用手機線性加速度";

  }

  // 如果無法取得線性加速度，估算扣除重力
  else if (validXYZ(event.accelerationIncludingGravity)) {

    const raw = event.accelerationIncludingGravity;

    const alpha =
      1 - Math.exp(-dt / 0.8);

    if (gravity === null) {

      gravity = {
        x: raw.x,
        y: raw.y,
        z: raw.z
      };

    } else {

      gravity.x += alpha * (raw.x - gravity.x);
      gravity.y += alpha * (raw.y - gravity.y);
      gravity.z += alpha * (raw.z - gravity.z);

    }

    x = raw.x - gravity.x;
    y = raw.y - gravity.y;
    z = raw.z - gravity.z;

    document.getElementById("sensorStatus").textContent =
      "✅ 使用估算方式扣除重力";

  }

  else {

    document.getElementById("sensorStatus").textContent =
      "⚠️ 尚未取得有效加速度資料";

    return;

  }

  // 計算總加速度
  const total = Math.sqrt(
    x * x + y * y + z * z
  );

  lastX = x;
  lastY = y;
  lastZ = z;
  lastTotal = total;

  // 更新手機畫面
  document.getElementById("x").textContent =
    x.toFixed(2);

  document.getElementById("y").textContent =
    y.toFixed(2);

  document.getElementById("z").textContent =
    z.toFixed(2);

  // 每 100ms 傳送一次資料
  if (now - lastPublishTime >= 100) {

    publishData(
      "reading",
      alarmActive,
      x,
      y,
      z,
      total
    );

    lastPublishTime = now;

  }

  // ===================================
  // 地震警報判斷
  // ===================================

  if (!alarmActive) {

    if (total > THRESHOLD) {

      if (highSince === null) {
        highSince = now;
      }

      // 超過 0.8 並持續 200ms
      if (now - highSince >= 200) {
        triggerAlarm(total);
      }

    } else {

      highSince = null;

    }

  } else {

    if (total < RESET_THRESHOLD) {

      if (lowSince === null) {
        lowSince = now;
      }

      // 低於 0.52 並持續 1.5 秒
      if (now - lowSince >= 1500) {
        clearAlarm(total);
      }

    } else {

      lowSince = null;

    }

  }

}

// =====================================
// 11. 開始監測
// =====================================

async function startMonitoring() {

  if (tracking || starting) return;

  if (!window.isSecureContext) {

    alert("請使用 HTTPS 網址開啟本程式。");
    return;

  }

  if (!("DeviceMotionEvent" in window)) {

    alert("此瀏覽器不支援手機動作感測器。");
    return;

  }

  starting = true;

  try {

    // 重要：第一個非同步操作就是申請感測器權限。
    // 必須直接由使用者點擊開始按鈕觸發。
    // 不要在權限申請前呼叫音效初始化。

    if (
      typeof DeviceMotionEvent.requestPermission === "function"
    ) {

      const permission =
        await DeviceMotionEvent.requestPermission();

      if (permission !== "granted") {

        alert(
          "感測器權限未開啟，請允許動作與方向感測器。"
        );

        return;

      }

    }

    // 清除舊資料
    gravity = null;

    lastSensorTime = 0;
    lastPublishTime = 0;
    lastSensorEventTime = 0;

    highSince = null;
    lowSince = null;

    alarmActive = false;

    updateAlarm(false, 0);
    stopAlarmSound();

    tracking = true;

    window.addEventListener(
      "devicemotion",
      handleMotion,
      true
    );

    document.getElementById("trackingStatus").textContent =
      "目前狀態：監測中";

    document.getElementById("sensorStatus").textContent =
      "等待手機感測器資料...";

    publishData(
      "start",
      false,
      0,
      0,
      0,
      0
    );

    // 如果 4 秒都沒有資料，提示檢查權限
    clearTimeout(noSensorTimer);

    noSensorTimer = setTimeout(() => {

      if (
        tracking &&
        lastSensorEventTime === 0
      ) {

        document.getElementById("sensorStatus").textContent =
          "⚠️ 尚未收到感測器資料，請檢查手機權限與裝置支援";

      }

    }, 4000);

  } catch (error) {

    console.error("感測器啟動失敗：", error);

    alert(
      "感測器啟動失敗：" +
      error.name + "：" + error.message
    );

  } finally {

    starting = false;

  }

}

// =====================================
// 12. 停止監測
// =====================================

function stopMonitoring() {

  if (!tracking) return;

  tracking = false;

  window.removeEventListener(
    "devicemotion",
    handleMotion,
    true
  );

  clearTimeout(noSensorTimer);

  // 停止時將警報解除
  alarmActive = false;

  stopAlarmSound();

  updateAlarm(false, lastTotal);

  publishData(
    "stop",
    false,
    lastX,
    lastY,
    lastZ,
    lastTotal
  );

  highSince = null;
  lowSince = null;

  document.getElementById("trackingStatus").textContent =
    "目前狀態：已停止";

  document.getElementById("sensorStatus").textContent =
    "感測器已停止";

}

// =====================================
// 13. 警報聲按鈕
// =====================================

document.getElementById("soundBtn")
  .addEventListener("click", async () => {

    if (!soundEnabled) {

      await enableAudio();

    } else {

      soundEnabled = false;

      stopAlarmSound();

      document.getElementById("soundBtn").textContent =
        "🔇 警報聲：已關閉";

    }

  });

// =====================================
// 14. 按鈕事件
// =====================================

document.getElementById("startBtn")
  .addEventListener("click", startMonitoring);

document.getElementById("stopBtn")
  .addEventListener("click", stopMonitoring);

</script>

</body>
</html>
