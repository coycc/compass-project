
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台灣車牌 AI 辨識系統</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:15px;background:#101827;color:white;
  font-family:Arial,"Microsoft JhengHei",sans-serif
}
h2{margin-top:4px}
.panel{
  background:#1e293b;border-radius:13px;
  padding:14px;margin-bottom:13px
}
button{
  border:0;border-radius:9px;padding:13px 17px;
  background:#16a34a;color:white;font-size:16px;font-weight:bold
}
button:disabled{opacity:.5}
.camera{
  position:relative;width:100%;background:#000;
  border-radius:10px;overflow:hidden;margin-top:12px
}
video{width:100%;display:block}
#overlay{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none
}
.small{font-size:13px;color:#cbd5e1;line-height:1.7}
.status{
  padding:10px;background:#0f172a;border-radius:8px;
  margin-top:10px;line-height:1.6;overflow-wrap:anywhere
}
.plate{
  font-size:32px;font-weight:bold;color:#facc15;
  letter-spacing:3px;margin:8px 0
}
.result{
  background:#0f172a;border-radius:8px;
  padding:9px;margin-top:7px
}
</style>
</head>

<body>

<h2>🚘 台灣車牌 AI 辨識系統</h2>

<div class="panel">
  <button id="startBtn">開啟後置鏡頭並開始辨識</button>
  <div class="small" style="margin-top:9px">
    請將手機對準電腦螢幕上的汽車照片，讓車牌盡量放大。
  </div>

  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="status" id="status">等待開啟鏡頭</div>
</div>

<div class="panel">
  <div class="small">最新辨識車牌</div>
  <div class="plate" id="latest">等待辨識</div>
  <div class="small" id="latestInfo">OCR 信心：--</div>
  <div class="small" id="mqttStatus">MQTT：連線中</div>
</div>

<div class="panel">
  <b>AI 偵測及辨識結果</b>
  <div id="results" class="small">尚無結果</div>
</div>

<div class="panel">
  <b>辨識紀錄</b>
  <div id="history" class="small">尚無紀錄</div>
</div>

<canvas id="inputCanvas" width="640" height="640" style="display:none"></canvas>
<canvas id="cropCanvas" width="1200" height="360" style="display:none"></canvas>

<script>
"use strict";

// -------------------------------
// 基本設定
// -------------------------------
const MODEL_URL="./best.onnx";
const MQTT_TOPIC="nutc/alpr/demo01/result";
const MODEL_SIZE=640;

const video=document.getElementById("video");
const overlay=document.getElementById("overlay");
const ctx=overlay.getContext("2d");

const inputCanvas=document.getElementById("inputCanvas");
const inputCtx=inputCanvas.getContext("2d");

const cropCanvas=document.getElementById("cropCanvas");
const cropCtx=cropCanvas.getContext("2d");

const startBtn=document.getElementById("startBtn");

let cameraStream=null;
let session=null;
let worker=null;
let scanning=false;
let busy=false;
let mqttClient=null;
let scanTimer=null;
let deviceId="PHONE-"+Math.random().toString(36).slice(2,8).toUpperCase();
let lastSent={};

// -------------------------------
// 狀態
// -------------------------------
function setStatus(message){
  document.getElementById("status").textContent=message;
}

// -------------------------------
// MQTT
// -------------------------------
function connectMQTT(){
  mqttClient=mqtt.connect(
    "wss://broker.hivemq.com:8884/mqtt",
    {
      clientId:"alpr_ai_"+Math.random().toString(16).slice(2,10),
      clean:true,
      connectTimeout:10000,
      reconnectPeriod:3000
    }
  );

  mqttClient.on("connect",()=>{
    document.getElementById("mqttStatus").textContent="MQTT：已連線";
  });

  mqttClient.on("reconnect",()=>{
    document.getElementById("mqttStatus").textContent="MQTT：重新連線中";
  });

  mqttClient.on("error",()=>{
    document.getElementById("mqttStatus").textContent="MQTT：連線錯誤";
  });
}

connectMQTT();

// -------------------------------
// 載入 YOLO ONNX 模型
// -------------------------------
async function loadModel(){
  setStatus("正在載入台灣車牌 YOLO AI 模型...");

  ort.env.wasm.numThreads=1;
  ort.env.wasm.simd=true;
  ort.env.wasm.wasmPaths=
    "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";

  session=await ort.InferenceSession.create(MODEL_URL,{
    executionProviders:["wasm"],
    graphOptimizationLevel:"all"
  });

  console.log("模型輸入：",session.inputNames);
  console.log("模型輸出：",session.outputNames);

  return session;
}

// -------------------------------
// 載入 OCR
// -------------------------------
async function loadOCR(){
  setStatus("正在載入車牌文字辨識 OCR...");

  worker=await Tesseract.createWorker("eng",1,{
    workerPath:"https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js",
    corePath:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core.wasm.js",
    langPath:"https://tessdata.projectnaptha.com/4.0.0"
  });

  await worker.setParameters({
    tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
    tessedit_pageseg_mode:"7"
  });
}

// -------------------------------
// YOLO 前處理：等比例縮放 + 補邊
// -------------------------------
function preprocess(){
  const W=video.videoWidth;
  const H=video.videoHeight;

  if(!W || !H){
    throw new Error("鏡頭畫面尚未準備好");
  }

  const scale=Math.min(MODEL_SIZE/W,MODEL_SIZE/H);
  const newW=Math.round(W*scale);
  const newH=Math.round(H*scale);

  const padX=(MODEL_SIZE-newW)/2;
  const padY=(MODEL_SIZE-newH)/2;

  inputCanvas.width=MODEL_SIZE;
  inputCanvas.height=MODEL_SIZE;

  inputCtx.fillStyle="#808080";
  inputCtx.fillRect(0,0,MODEL_SIZE,MODEL_SIZE);

  inputCtx.drawImage(
    video,
    0,0,W,H,
    padX,padY,newW,newH
  );

  const image=inputCtx.getImageData(
    0,0,MODEL_SIZE,MODEL_SIZE
  );

  const pixels=image.data;
  const data=new Float32Array(1*3*MODEL_SIZE*MODEL_SIZE);

  const area=MODEL_SIZE*MODEL_SIZE;

  for(let i=0;i<area;i++){
    const p=i*4;

    data[i]=(pixels[p]/255);
    data[area+i]=(pixels[p+1]/255);
    data[area*2+i]=(pixels[p+2]/255);
  }

  return {
    tensor:new ort.Tensor(
      "float32",
      data,
      [1,3,MODEL_SIZE,MODEL_SIZE]
    ),
    scale,
    padX,
    padY,
    originalW:W,
    originalH:H
  };
}

// -------------------------------
// YOLO 輸出解碼
// 預期輸出為 [1,300,18]
// 每列：x1,y1,x2,y2,confidence,class,
//       4 個車牌角點（每點 x,y,confidence）
// -------------------------------
function decodeOutput(output,meta){
  let dims=output.dims;
  let values=output.data;

  if(!dims || dims.length!==3){
    throw new Error(
      "模型輸出格式不符合預期："+JSON.stringify(dims)
    );
  }

  let rows=dims[1];
  let cols=dims[2];

  // 若輸出為 [1,18,N]，轉成 [N,18]
  if(rows<cols && rows<=32){
    const transposed=new Float32Array(rows*cols);

    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        transposed[c*rows+r]=values[r*cols+c];
      }
    }

    values=transposed;
    const temp=rows;
    rows=cols;
    cols=temp;
  }

  if(cols<6){
    throw new Error(
      "模型輸出欄位不足："+JSON.stringify(dims)
    );
  }

  const boxes=[];

  for(let i=0;i<rows;i++){
    const offset=i*cols;

    let x1=values[offset];
    let y1=values[offset+1];
    let x2=values[offset+2];
    let y2=values[offset+3];
    const score=values[offset+4];

    if(!Number.isFinite(score) || score<0.25)continue;

    // 只保留合理座標
    if(
      !Number.isFinite(x1) ||
      !Number.isFinite(y1) ||
      !Number.isFinite(x2) ||
      !Number.isFinite(y2)
    )continue;

    // 將模型座標轉回原始鏡頭座標
    const box={
      x:(x1-meta.padX)/meta.scale,
      y:(y1-meta.padY)/meta.scale,
      x2:(x2-meta.padX)/meta.scale,
      y2:(y2-meta.padY)/meta.scale,
      confidence:score
    };

    box.x=Math.max(0,Math.min(meta.originalW,box.x));
    box.y=Math.max(0,Math.min(meta.originalH,box.y));
    box.x2=Math.max(0,Math.min(meta.originalW,box.x2));
    box.y2=Math.max(0,Math.min(meta.originalH,box.y2));

    box.w=box.x2-box.x;
    box.h=box.y2-box.y;
    box.area=box.w*box.h;

    if(box.w<20 || box.h<10)continue;

    boxes.push(box);
  }

  // 信心高的排前面
  boxes.sort((a,b)=>b.confidence-a.confidence);

  // 移除重複框
  const selected=[];

  for(const box of boxes){
    let duplicate=false;

    for(const old of selected){
      const x1=Math.max(box.x,old.x);
      const y1=Math.max(box.y,old.y);
      const x2=Math.min(box.x2,old.x2);
      const y2=Math.min(box.y2,old.y2);

      const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1);
      const union=box.area+old.area-inter;

      if(union>0 && inter/union>0.5){
        duplicate=true;
        break;
      }
    }

    if(!duplicate)selected.push(box);
  }

  return selected.slice(0,8);
}

// -------------------------------
// AI 偵測
// -------------------------------
async function detectPlates(){
  const meta=preprocess();

  const inputName=session.inputNames[0];
  const outputName=session.outputNames[0];

  const feeds={};
  feeds[inputName]=meta.tensor;

  const result=await session.run(feeds);
  const output=result[outputName];

  if(!output){
    throw new Error("找不到模型輸出");
  }

  console.log("YOLO output shape:",output.dims);

  return decodeOutput(output,meta);
}

// -------------------------------
// 畫出車牌框
// -------------------------------
function drawBoxes(boxes){
  const W=video.videoWidth;
  const H=video.videoHeight;

  if(overlay.width!==W || overlay.height!==H){
    overlay.width=W;
    overlay.height=H;
  }

  ctx.clearRect(0,0,W,H);
  ctx.lineWidth=4;
  ctx.font="bold 20px Arial";

  boxes.forEach((box,i)=>{
    ctx.strokeStyle="#00ff55";
    ctx.strokeRect(box.x,box.y,box.w,box.h);

    ctx.fillStyle="#00ff55";
    ctx.fillText(
      "AI 車牌 "+(i+1),
      box.x,
      Math.max(22,box.y-6)
    );
  });
}

// -------------------------------
// 裁切並放大車牌
// -------------------------------
function cropPlate(box){
  const padX=box.w*0.08;
  const padY=box.h*0.20;

  const x=Math.max(0,box.x-padX);
  const y=Math.max(0,box.y-padY);

  const right=Math.min(
    video.videoWidth,
    box.x2+padX
  );

  const bottom=Math.min(
    video.videoHeight,
    box.y2+padY
  );

  const w=right-x;
  const h=bottom-y;

  cropCanvas.width=1200;
  cropCanvas.height=360;

  cropCtx.fillStyle="#ffffff";
  cropCtx.fillRect(0,0,1200,360);

  cropCtx.imageSmoothingEnabled=true;
  cropCtx.imageSmoothingQuality="high";

  const scale=Math.min(1160/w,320/h);
  const dw=w*scale;
  const dh=h*scale;

  cropCtx.drawImage(
    video,
    x,y,w,h,
    (1200-dw)/2,
    (360-dh)/2,
    dw,dh
  );

  return {x,y,w,h};
}

// -------------------------------
// OCR 文字校正
// -------------------------------
function correctPlate(text){
  let s=(text||"")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,"");

  // 常見七碼格式：三個英文字母 + 四個數字
  for(let i=0;i<=s.length-7;i++){
    let p=s.substring(i,i+7).split("");

    const letterMap={
      "0":"O",
      "1":"I",
      "5":"S",
      "8":"B"
    };

    const numberMap={
      "O":"0",
      "Q":"0",
      "D":"0",
      "I":"1",
      "L":"1",
      "Z":"2",
      "S":"5",
      "B":"8",
      "G":"6"
    };

    for(let j=0;j<3;j++){
      if(letterMap[p[j]])p[j]=letterMap[p[j]];
    }

    for(let j=3;j<7;j++){
      if(numberMap[p[j]])p[j]=numberMap[p[j]];
    }

    const candidate=p.join("");

    if(/^[A-Z]{3}[0-9]{4}$/.test(candidate)){
      return candidate;
    }
  }

  return "";
}

// -------------------------------
// OCR 辨識
// -------------------------------
async function recognizePlate(box){
  const bbox=cropPlate(box);

  const result=await worker.recognize(cropCanvas);
  const raw=result.data.text||"";
  const plate=correctPlate(raw);

  if(!plate)return null;

  return {
    plate,
    confidence:Math.round(result.data.confidence||0),
    bbox,
    raw,
    detectorConfidence:Math.round(box.confidence*100)
  };
}

// -------------------------------
// MQTT 發送
// -------------------------------
function publishResult(item){
  if(!mqttClient || !mqttClient.connected)return;

  const now=Date.now();

  if(lastSent[item.plate] && now-lastSent[item.plate]<5000){
    return;
  }

  lastSent[item.plate]=now;

  const data={
    type:"license_plate",
    plate:item.plate,
    confidence:item.confidence,
    detector_confidence:item.detectorConfidence,
    bbox:{
      x:item.bbox.x,
      y:item.bbox.y,
      w:item.bbox.w,
      h:item.bbox.h
    },
    raw_text:item.raw,
    device_id:deviceId,
    time:new Date().toISOString(),
    timestamp:now
  };

  mqttClient.publish(
    MQTT_TOPIC,
    JSON.stringify(data)
  );
}

// -------------------------------
// 顯示辨識結果
// -------------------------------
function showResults(items){
  const results=document.getElementById("results");
  results.innerHTML="";

  if(!items.length){
    results.textContent="AI 已掃描，但 OCR 尚未讀到有效車牌";
    return;
  }

  items.forEach(item=>{
    const div=document.createElement("div");
    div.className="result";

    div.textContent=
      item.plate+
      "｜OCR "+item.confidence+"%"+
      "｜AI "+item.detectorConfidence+"%";

    results.appendChild(div);

    publishResult(item);
  });

  const best=items[0];

  document.getElementById("latest").textContent=best.plate;
  document.getElementById("latestInfo").textContent=
    "OCR 信心："+best.confidence+
    "%｜AI 偵測信心："+best.detectorConfidence+"%";

  const history=document.getElementById("history");

  if(history.textContent==="尚無紀錄"){
    history.textContent="";
  }

  const line=document.createElement("div");
  line.className="result";

  line.textContent=
    new Date().toLocaleTimeString()+
    "　"+best.plate+
    "　OCR "+best.confidence+"%";

  history.prepend(line);

  while(history.children.length>30){
    history.removeChild(history.lastChild);
  }
}

// -------------------------------
// 掃描流程
// -------------------------------
async function scan(){
  if(!scanning || busy || !session || !worker)return;
  if(video.readyState<2)return;

  busy=true;

  try{
    setStatus("YOLO AI 正在尋找車牌...");

    const boxes=await detectPlates();
    drawBoxes(boxes);

    setStatus(
      "AI 找到 "+boxes.length+
      " 個車牌候選區域，正在辨識文字..."
    );

    const found=[];

    for(const box of boxes){
      if(!scanning)break;

      try{
        const item=await recognizePlate(box);
        if(item)found.push(item);
      }catch(e){
        console.warn("OCR 錯誤",e);
      }
    }

    // 相同車牌只保留一筆
    const unique=[];

    for(const item of found){
      if(!unique.some(old=>old.plate===item.plate)){
        unique.push(item);
      }
    }

    // 黃框表示 OCR 成功
    unique.forEach(item=>{
      ctx.strokeStyle="#ffff00";
      ctx.lineWidth=5;

      ctx.strokeRect(
        item.bbox.x,
        item.bbox.y,
        item.bbox.w,
        item.bbox.h
      );

      ctx.fillStyle="#ffff00";
      ctx.font="bold 22px Arial";

      ctx.fillText(
        item.plate,
        item.bbox.x,
        Math.max(24,item.bbox.y-8)
      );
    });

    showResults(unique);

    setStatus(
      "掃描完成：AI 找到 "+boxes.length+
      " 個區域，OCR 成功 "+unique.length+" 個"
    );

  }catch(e){
    console.error(e);
    setStatus("辨識錯誤："+e.message);
  }finally{
    busy=false;
  }
}

// -------------------------------
// 開啟相機
// -------------------------------
async function startCamera(){
  startBtn.disabled=true;

  try{
    setStatus("正在開啟手機後置鏡頭...");

    cameraStream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    video.srcObject=cameraStream;
    await video.play();

    await loadModel();
    await loadOCR();

    scanning=true;

    startBtn.textContent="鏡頭已開啟，AI 自動掃描中";
    setStatus("模型載入成功，開始辨識！");

    scan();

    scanTimer=setInterval(scan,2500);

  }catch(e){
    console.error(e);
    setStatus("啟動失敗："+e.message);
    startBtn.disabled=false;
  }
}

startBtn.addEventListener("click",startCamera);

</script>
</body>
</html>
