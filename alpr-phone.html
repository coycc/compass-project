
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>車牌即時掃描系統</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#101827;color:#fff;font-family:Arial,"Microsoft JhengHei",sans-serif}
h2{margin:4px 0 14px}
.panel{background:#1e293b;border-radius:14px;padding:14px;margin-bottom:13px}
button{border:0;border-radius:9px;padding:12px 16px;background:#16a34a;color:white;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
video{width:100%;display:block;border-radius:10px;background:#000}
.camera{position:relative;width:100%;overflow:hidden;border-radius:10px;background:#000}
canvas#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
input[type=range]{width:100%}
.small{font-size:13px;color:#cbd5e1;line-height:1.6}
.status{padding:10px;background:#0f172a;border-radius:8px;margin-top:10px;line-height:1.6;overflow-wrap:anywhere}
.result{font-size:30px;font-weight:bold;color:#facc15;letter-spacing:2px}
#history{max-height:190px;overflow:auto;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<h2>📷 台灣車牌即時掃描</h2>

<div class="panel">
  <button id="cameraBtn">開啟後置鏡頭並開始掃描</button>
  <div class="small" style="margin-top:9px">請將手機鏡頭對準電腦螢幕上的車牌照片，保持車牌清楚、完整，避免反光。</div>
  <div class="camera" style="margin-top:12px">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="status" id="status">尚未開啟鏡頭</div>
</div>

<div class="panel">
  <b>掃描靈敏度：<span id="sensText">7</span></b>
  <input id="sensitivity" type="range" min="1" max="10" value="7">
  <div class="small">數字越高，越容易接受模糊或不完整的辨識結果，但誤判也可能增加。</div>
  <div style="margin-top:12px"><b>OCR 信心門檻：<span id="confText">25</span>%</b></div>
  <input id="confidence" type="range" min="5" max="90" value="25">
</div>

<div class="panel">
  <div class="small">最新辨識結果</div>
  <div class="result" id="plate">等待辨識</div>
  <div class="small" id="detail">信心分數：--</div>
  <div class="small" id="mqttStatus">MQTT：連線中...</div>
</div>

<div class="panel">
  <b>辨識紀錄</b>
  <div id="history" class="small">尚無紀錄</div>
</div>

<canvas id="work" style="display:none"></canvas>

<script>
const TOPIC = "nutc/alpr/demo01/result";
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
const work = document.getElementById("work");
const wctx = work.getContext("2d");
const statusEl = document.getElementById("status");
const cameraBtn = document.getElementById("cameraBtn");
const sensitivity = document.getElementById("sensitivity");
const confidenceInput = document.getElementById("confidence");

let stream = null;
let worker = null;
let scanning = false;
let busy = false;
let mqttClient = null;
let lastPlate = "";
let lastSent = 0;
let scanTimer = null;
let deviceId = "PHONE-" + Math.random().toString(36).slice(2,8).toUpperCase();

document.getElementById("sensitivity").addEventListener("input", e=>{
  document.getElementById("sensText").textContent=e.target.value;
});
confidenceInput.addEventListener("input", e=>{
  document.getElementById("confText").textContent=e.target.value;
});

function setStatus(t){statusEl.textContent=t;}

function connectMQTT(){
  mqttClient = mqtt.connect("wss://broker.hivemq.com:8884/mqtt",{
    clientId:"alpr_phone_"+Math.random().toString(16).slice(2,10),
    clean:true,
    connectTimeout:10000,
    reconnectPeriod:3000
  });
  mqttClient.on("connect",()=>{
    document.getElementById("mqttStatus").textContent="MQTT：已連線";
  });
  mqttClient.on("reconnect",()=>{
    document.getElementById("mqttStatus").textContent="MQTT：重新連線中";
  });
  mqttClient.on("error",()=>{
    document.getElementById("mqttStatus").textContent="MQTT：連線錯誤";
  });
}

function normalizeText(s){
  return (s||"").toUpperCase()
    .replace(/[ＯΟ]/g,"0").replace(/[Ｉ|!]/g,"1")
    .replace(/[Ｓ]/g,"5").replace(/[Ｂ]/g,"8")
    .replace(/[^A-Z0-9]/g,"");
}

function findPlate(text){
  const clean=normalizeText(text);
  const patterns=[
    /[A-Z]{3}[0-9]{4}/g,
    /[A-Z]{2}[0-9]{4}/g,
    /[0-9]{4}[A-Z]{2,3}/g,
    /[A-Z]{2,3}[0-9]{3,4}/g
  ];
  for(const p of patterns){
    const m=clean.match(p);
    if(m && m.length) return m[0];
  }
  return "";
}

function drawBox(box,color="#ffd400"){
  const sx=overlay.width/video.videoWidth;
  const sy=overlay.height/video.videoHeight;
  ctx.strokeStyle=color;
  ctx.lineWidth=4;
  ctx.strokeRect(box.x*sx,box.y*sy,(box.w-box.x)*sx,(box.h-box.y)*sy);
}

function publishResult(plate, conf, box, rawText){
  const now=Date.now();
  if(!mqttClient || !mqttClient.connected) return;
  if(plate===lastPlate && now-lastSent<5000) return;
  lastPlate=plate;
  lastSent=now;

  const data={
    type:"license_plate",
    plate:plate,
    confidence:Math.round(conf),
    bbox:box,
    raw_text:rawText,
    device_id:deviceId,
    time:new Date().toISOString(),
    timestamp:now
  };
  mqttClient.publish(TOPIC,JSON.stringify(data),{qos:0});
}

function addHistory(plate,conf){
  const el=document.getElementById("history");
  if(el.textContent==="尚無紀錄") el.textContent="";
  const line=document.createElement("div");
  line.textContent=new Date().toLocaleTimeString()+"　"+plate+"　信心 "+Math.round(conf)+"%";
  el.prepend(line);
  while(el.children.length>30) el.removeChild(el.lastChild);
}

async function loadOCR(){
  setStatus("正在載入文字辨識模型，第一次載入需要一些時間...");
  worker=await Tesseract.createWorker("eng",1,{
    workerPath:"https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js",
    corePath:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core.wasm.js",
    langPath:"https://tessdata.projectnaptha.com/4.0.0"
  });
  await worker.setParameters({
    tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-",
    preserve_interword_spaces:"1"
  });
}

async function scanFrame(){
  if(!scanning || busy || !worker || video.readyState<2) return;
  busy=true;
  try{
    const vw=video.videoWidth, vh=video.videoHeight;
    if(!vw || !vh) return;

    overlay.width=vw;
    overlay.height=vh;
    ctx.clearRect(0,0,vw,vh);

    // 縮小畫面以提升 OCR 速度，保留完整影像比例
    const maxW=1280;
    const scale=Math.min(1,maxW/vw);
    work.width=Math.round(vw*scale);
    work.height=Math.round(vh*scale);
    wctx.drawImage(video,0,0,work.width,work.height);

    // 提高文字對比，協助辨識螢幕上的車牌
    const img=wctx.getImageData(0,0,work.width,work.height);
    const d=img.data;
    for(let i=0;i<d.length;i+=4){
      const gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      const contrast=Math.max(0,Math.min(255,(gray-128)*1.45+128));
      d[i]=d[i+1]=d[i+2]=contrast;
    }
    wctx.putImageData(img,0,0);

    setStatus("正在掃描畫面... 請讓車牌保持清楚");
    const result=await worker.recognize(work);
    const text=result.data.text || "";
    const words=(result.data.words||[]).filter(x=>x.text && x.confidence>=Number(confidenceInput.value));
    const plate=findPlate(text);

    if(plate){
      let matched=words.find(x=>findPlate(x.text)===plate);
      if(!matched && words.length) matched=words.sort((a,b)=>b.confidence-a.confidence)[0];

      let box={x:0,y:0,w:vw,h:vh};
      if(matched){
        box={
          x:Math.round(matched.bbox.x0/scale),
          y:Math.round(matched.bbox.y0/scale),
          w:Math.round(matched.bbox.x1/scale),
          h:Math.round(matched.bbox.y1/scale)
        };
        // 擴大框線，讓車牌文字更容易看見
        const padX=Math.round((box.w-box.x)*0.18);
        const padY=Math.round((box.h-box.y)*0.55);
        box.x=Math.max(0,box.x-padX);
        box.y=Math.max(0,box.y-padY);
        box.w=Math.min(vw,box.w+padX);
        box.h=Math.min(vh,box.h+padY);
      }

      drawBox(box,"#ffd400");
      const conf=matched ? matched.confidence : result.data.confidence;
      document.getElementById("plate").textContent=plate;
      document.getElementById("detail").textContent=
        "信心分數："+Math.round(conf)+"%　｜　框選位置："+box.x+","+box.y;
      setStatus("找到疑似車牌："+plate);
      publishResult(plate,conf,box,text);
      addHistory(plate,conf);
    }else{
      document.getElementById("plate").textContent="尚未辨識到";
      document.getElementById("detail").textContent="請調整手機距離、角度或靈敏度";
      setStatus("持續掃描中；OCR文字："+(text.trim().replace(/\s+/g," ").slice(0,100)||"目前沒有讀到文字"));
      // 顯示 OCR 讀到的文字位置，方便確認是否有掃到螢幕文字
      if(words.length){
        ctx.strokeStyle="#22c55e";
        ctx.lineWidth=2;
        words.forEach(word=>{
          const b=word.bbox;
          ctx.strokeRect(b.x0/scale,b.y0/scale,(b.x1-b.x0)/scale,(b.y1-b.y0)/scale);
        });
      }
    }
  }catch(err){
    console.error(err);
    setStatus("掃描錯誤："+(err.message||err));
  }finally{
    busy=false;
  }
}

async function startCamera(){
  cameraBtn.disabled=true;
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("瀏覽器不支援相機，請使用 HTTPS 網址開啟");
    }
    setStatus("正在開啟手機後置鏡頭...");
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}
    });
    video.srcObject=stream;
    await video.play();

    await loadOCR();
    scanning=true;
    cameraBtn.textContent="鏡頭已開啟，正在自動掃描";
    setStatus("鏡頭與辨識模型已準備完成，開始掃描！");
    scanTimer=setInterval(scanFrame,1800);
  }catch(err){
    setStatus("無法啟動："+err.message+"。請確認相機權限，並使用 HTTPS 網址。");
    cameraBtn.disabled=false;
  }
}

cameraBtn.addEventListener("click",startCamera);
connectMQTT();
</script>
</body>
</html>
