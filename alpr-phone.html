
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣車牌 AI 辨識</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:15px;background:#101827;color:white;
  font-family:Arial,"Microsoft JhengHei",sans-serif
}
h2{margin-top:4px}
.panel{
  background:#1e293b;border-radius:13px;
  padding:14px;margin-bottom:13px
}
button{
  border:0;border-radius:9px;padding:13px 17px;
  background:#16a34a;color:white;font-size:16px;font-weight:bold
}
button:disabled{opacity:.5}
.camera{
  position:relative;width:100%;background:#000;
  border-radius:10px;overflow:hidden;margin-top:12px
}
video{width:100%;display:block}
#overlay{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none
}
input[type=range]{width:100%}
.small{font-size:13px;color:#cbd5e1;line-height:1.7}
.status{
  padding:10px;background:#0f172a;border-radius:8px;
  margin-top:10px;line-height:1.6;overflow-wrap:anywhere
}
.plate{
  font-size:32px;font-weight:bold;color:#facc15;
  letter-spacing:3px;margin:8px 0
}
.result{
  background:#0f172a;border-radius:8px;
  padding:9px;margin-top:7px
}
</style>
</head>

<body>

<h2>🚘 台灣車牌辨識系統</h2>

<div class="panel">
  <button id="startBtn">開啟後置鏡頭並開始辨識</button>
  <div class="small" style="margin-top:9px">
    請將手機對準電腦螢幕上的汽車照片，讓車牌盡量放大。
  </div>

  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="status" id="status">等待開啟鏡頭</div>
</div>

<div class="panel">
  <b>偵測靈敏度：<span id="sensitivityText">8</span></b>
  <input id="sensitivity" type="range" min="1" max="10" value="8">

  <b>最低 OCR 信心：<span id="confidenceText">15</span>%</b>
  <input id="confidence" type="range" min="5" max="90" value="15">
</div>

<div class="panel">
  <div class="small">最新辨識結果</div>
  <div class="plate" id="latest">等待辨識</div>
  <div class="small" id="latestInfo">信心分數：--</div>
  <div class="small" id="mqttStatus">MQTT：連線中</div>
</div>

<div class="panel">
  <b>候選車牌辨識結果</b>
  <div id="results" class="small">尚無結果</div>
</div>

<div class="panel">
  <b>辨識紀錄</b>
  <div id="history" class="small">尚無紀錄</div>
</div>

<canvas id="frameCanvas" style="display:none"></canvas>
<canvas id="ocrCanvas1" width="1000" height="300" style="display:none"></canvas>
<canvas id="ocrCanvas2" width="1000" height="300" style="display:none"></canvas>
<canvas id="ocrCanvas3" width="1000" height="300" style="display:none"></canvas>

<script>
const TOPIC="nutc/alpr/demo01/result";

const video=document.getElementById("video");
const overlay=document.getElementById("overlay");
const ctx=overlay.getContext("2d");

const frameCanvas=document.getElementById("frameCanvas");
const frameCtx=frameCanvas.getContext("2d");

const canvases=[
  document.getElementById("ocrCanvas1"),
  document.getElementById("ocrCanvas2"),
  document.getElementById("ocrCanvas3")
];

let worker=null;
let stream=null;
let scanning=false;
let busy=false;
let client=null;
let deviceId="PHONE-"+Math.random().toString(36).slice(2,8);
let lastSent={};

const sensitivity=document.getElementById("sensitivity");
const confidence=document.getElementById("confidence");

sensitivity.oninput=()=>{
  document.getElementById("sensitivityText").textContent=sensitivity.value;
};
confidence.oninput=()=>{
  document.getElementById("confidenceText").textContent=confidence.value;
};

function setStatus(s){
  document.getElementById("status").textContent=s;
}

// MQTT
function connectMQTT(){
  client=mqtt.connect("wss://broker.hivemq.com:8884/mqtt",{
    clientId:"alpr_"+Math.random().toString(16).slice(2,12),
    clean:true,
    connectTimeout:10000,
    reconnectPeriod:3000
  });

  client.on("connect",()=>{
    document.getElementById("mqttStatus").textContent="MQTT：已連線";
  });

  client.on("reconnect",()=>{
    document.getElementById("mqttStatus").textContent="MQTT：重新連線中";
  });

  client.on("error",()=>{
    document.getElementById("mqttStatus").textContent="MQTT：連線錯誤";
  });
}
connectMQTT();

// 等待 OpenCV
function waitCV(){
  return new Promise((resolve,reject)=>{
    let count=0;
    const timer=setInterval(()=>{
      count++;
      if(window.cv && cv.Mat && cv.imread){
        clearInterval(timer);
        resolve();
      }
      if(count>120){
        clearInterval(timer);
        reject(new Error("OpenCV 載入逾時"));
      }
    },500);
  });
}

// 將 OCR 文字轉換成車牌格式
function correctPlate(text){
  let s=(text||"").toUpperCase()
    .replace(/[^A-Z0-9]/g,"");

  // 嘗試從文字中找出連續七個字元
  for(let i=0;i<=s.length-7;i++){
    let part=s.substring(i,i+7).split("");

    // 前三位應為英文字母
    const letterMap={
      "0":"O","1":"I","5":"S","8":"B"
    };

    for(let j=0;j<3;j++){
      if(letterMap[part[j]])part[j]=letterMap[part[j]];
    }

    // 後四位應為數字
    const numberMap={
      "O":"0","Q":"0","D":"0",
      "I":"1","L":"1",
      "Z":"2","S":"5","B":"8",
      "G":"6"
    };

    for(let j=3;j<7;j++){
      if(numberMap[part[j]])part[j]=numberMap[part[j]];
    }

    const result=part.join("");

    if(/^[A-Z]{3}[0-9]{4}$/.test(result)){
      return result;
    }
  }

  return "";
}

// 計算框重疊
function iou(a,b){
  const x1=Math.max(a.x,b.x);
  const y1=Math.max(a.y,b.y);
  const x2=Math.min(a.x+a.w,b.x+b.w);
  const y2=Math.min(a.y+a.h,b.y+b.h);

  const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1);
  const total=a.w*a.h+b.w*b.h-inter;
  return total>0?inter/total:0;
}

// 合併重複候選區域
function removeDuplicates(arr){
  arr.sort((a,b)=>b.area-a.area);
  const out=[];

  for(const a of arr){
    if(!out.some(b=>iou(a,b)>0.45)){
      out.push(a);
    }
  }
  return out.slice(0,10);
}

// 偵測白色車牌區域
function findPlates(){
  const W=video.videoWidth;
  const H=video.videoHeight;

  if(!W || !H)return [];

  frameCanvas.width=W;
  frameCanvas.height=H;
  frameCtx.drawImage(video,0,0,W,H);

  const src=cv.imread(frameCanvas);
  const gray=new cv.Mat();
  const blur=new cv.Mat();
  const white=new cv.Mat();
  const edges=new cv.Mat();
  const combined=new cv.Mat();
  const closed=new cv.Mat();
  const contours=new cv.MatVector();
  const hierarchy=new cv.Mat();

  const kernel=cv.getStructuringElement(
    cv.MORPH_RECT,new cv.Size(15,5)
  );

  const found=[];

  try{
    cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);

    // 白色區域
    const level=Number(sensitivity.value);
    const thresholdValue=190-level*5;

    cv.threshold(
      blur,white,thresholdValue,255,cv.THRESH_BINARY
    );

    // 邊緣區域
    cv.Canny(blur,edges,40,130);

    // 合併白色區域與邊緣
    cv.bitwise_or(white,edges,combined);

    cv.morphologyEx(
      combined,closed,cv.MORPH_CLOSE,kernel
    );

    cv.findContours(
      closed,contours,hierarchy,
      cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE
    );

    const total=W*H;
    const minArea=total*(0.0005+(10-level)*0.00008);

    for(let i=0;i<contours.size();i++){
      const c=contours.get(i);
      const r=cv.boundingRect(c);

      const w=r.width;
      const h=r.height;
      const ratio=w/Math.max(h,1);
      const area=w*h;

      if(
        area>minArea &&
        w>W*0.07 &&
        h>H*0.018 &&
        ratio>=2.0 &&
        ratio<=6.5 &&
        w<W*0.85
      ){
        found.push({
          x:r.x,y:r.y,w:w,h:h,area:area
        });
      }
      c.delete();
    }

    return removeDuplicates(found);

  }finally{
    src.delete();
    gray.delete();
    blur.delete();
    white.delete();
    edges.delete();
    combined.delete();
    closed.delete();
    contours.delete();
    hierarchy.delete();
    kernel.delete();
  }
}

// 畫出綠色候選框
function drawBoxes(boxes){
  const W=video.videoWidth;
  const H=video.videoHeight;

  if(overlay.width!==W || overlay.height!==H){
    overlay.width=W;
    overlay.height=H;
  }

  ctx.clearRect(0,0,W,H);
  ctx.lineWidth=3;
  ctx.font="bold 18px Arial";
  ctx.strokeStyle="#00ff55";
  ctx.fillStyle="#00ff55";

  boxes.forEach((b,i)=>{
    ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillText("候選 "+(i+1),b.x,Math.max(20,b.y-5));
  });
}

// 建立三種 OCR 影像
function prepareOCR(box){
  const px=Math.round(box.w*0.10);
  const py=Math.round(box.h*0.20);

  const x=Math.max(0,box.x-px);
  const y=Math.max(0,box.y-py);
  const right=Math.min(video.videoWidth,box.x+box.w+px);
  const bottom=Math.min(video.videoHeight,box.y+box.h+py);

  const w=right-x;
  const h=bottom-y;

  const targetW=1000;
  const targetH=300;

  const scale=Math.min(960/w,260/h);
  const dw=w*scale;
  const dh=h*scale;
  const dx=(targetW-dw)/2;
  const dy=(targetH-dh)/2;

  const outputs=[];

  for(let n=0;n<3;n++){
    const canvas=canvases[n];
    canvas.width=targetW;
    canvas.height=targetH;

    const c=canvas.getContext("2d");
    c.fillStyle="white";
    c.fillRect(0,0,targetW,targetH);
    c.imageSmoothingEnabled=true;
    c.imageSmoothingQuality="high";

    c.drawImage(video,x,y,w,h,dx,dy,dw,dh);

    const img=c.getImageData(0,0,targetW,targetH);
    const d=img.data;

    for(let i=0;i<d.length;i+=4){
      const gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];

      let value=gray;

      if(n===0){
        value=Math.max(0,Math.min(255,(gray-120)*2+128));
      }else if(n===1){
        value=gray>155?255:0;
      }else{
        value=gray>125?255:0;
      }

      d[i]=d[i+1]=d[i+2]=value;
    }

    c.putImageData(img,0,0);
    outputs.push(canvas);
  }

  return {
    canvases:outputs,
    bbox:{x,y,w,h}
  };
}

// 多次 OCR 投票
async function recognizePlate(box){
  const prepared=prepareOCR(box);
  const votes={};

  const modes=["7","8","13"];

  for(let i=0;i<3;i++){
    await worker.setParameters({
      tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
      tessedit_pageseg_mode:modes[i]
    });

    const result=await worker.recognize(prepared.canvases[i]);
    const text=result.data.text||"";
    const plate=correctPlate(text);

    if(plate){
      if(!votes[plate]){
        votes[plate]={
          count:0,
          score:0,
          raw:text
        };
      }

      votes[plate].count++;
      votes[plate].score+=Number(result.data.confidence)||0;
    }
  }

  const entries=Object.entries(votes);
  if(!entries.length)return null;

  entries.sort((a,b)=>{
    if(b[1].count!==a[1].count){
      return b[1].count-a[1].count;
    }
    return b[1].score-a[1].score;
  });

  const best=entries[0];
  const average=best[1].score/best[1].count;

  if(average<Number(confidence.value))return null;

  return {
    plate:best[0],
    confidence:Math.round(average),
    bbox:prepared.bbox,
    raw:best[1].raw,
    votes:best[1].count
  };
}

// 發布結果
function publish(item){
  if(!client || !client.connected)return;

  const now=Date.now();

  if(lastSent[item.plate] && now-lastSent[item.plate]<5000){
    return;
  }

  lastSent[item.plate]=now;

  const data={
    type:"license_plate",
    plate:item.plate,
    confidence:item.confidence,
    bbox:{
      x:item.bbox.x,
      y:item.bbox.y,
      w:item.bbox.x+item.bbox.w,
      h:item.bbox.y+item.bbox.h
    },
    raw_text:item.raw,
    device_id:deviceId,
    time:new Date().toISOString(),
    timestamp:now
  };

  client.publish(TOPIC,JSON.stringify(data));
}

// 顯示結果
function showResults(items){
  const results=document.getElementById("results");
  results.innerHTML="";

  if(!items.length){
    results.textContent="尚未辨識到符合格式的車牌";
    return;
  }

  items.forEach(item=>{
    const div=document.createElement("div");
    div.className="result";
    div.textContent=
      item.plate+"　信心 "+item.confidence+
      "%　投票 "+item.votes+"/3";
    results.appendChild(div);

    publish(item);
  });

  const best=items.slice().sort(
    (a,b)=>b.votes-a.votes || b.confidence-a.confidence
  )[0];

  document.getElementById("latest").textContent=best.plate;
  document.getElementById("latestInfo").textContent=
    "OCR 信心："+best.confidence+
    "%，辨識投票："+best.votes+"/3";

  const history=document.getElementById("history");

  if(history.textContent==="尚無紀錄"){
    history.textContent="";
  }

  const line=document.createElement("div");
  line.className="result";
  line.textContent=
    new Date().toLocaleTimeString()+"　"+
    best.plate+"　"+best.confidence+"%";

  history.prepend(line);

  while(history.children.length>30){
    history.removeChild(history.lastChild);
  }
}

// 掃描畫面
async function scan(){
  if(!scanning || busy || !worker || video.readyState<2)return;

  busy=true;

  try{
    setStatus("正在尋找白色車牌區域...");

    const boxes=findPlates();
    drawBoxes(boxes);

    setStatus("找到 "+boxes.length+" 個候選區域，正在進行三次 OCR...");

    const results=[];

    for(const box of boxes){
      if(!scanning)break;

      try{
        const item=await recognizePlate(box);
        if(item)results.push(item);
      }catch(e){
        console.warn("OCR 個別候選失敗",e);
      }
    }

    const unique=[];

    for(const item of results){
      if(!unique.some(old=>old.plate===item.plate)){
        unique.push(item);
      }
    }

    // 成功辨識的車牌畫黃色框
    unique.forEach(item=>{
      ctx.strokeStyle="#ffff00";
      ctx.lineWidth=5;
      ctx.strokeRect(
        item.bbox.x,item.bbox.y,
        item.bbox.w,item.bbox.h
      );

      ctx.fillStyle="#ffff00";
      ctx.font="bold 22px Arial";
      ctx.fillText(
        item.plate,
        item.bbox.x,
        Math.max(24,item.bbox.y-8)
      );
    });

    showResults(unique);

    setStatus(
      "掃描完成：候選 "+boxes.length+
      " 個，辨識成功 "+unique.length+" 個"
    );

  }catch(e){
    console.error(e);
    setStatus("辨識錯誤："+e.message);
  }finally{
    busy=false;
  }
}

// 啟動相機
async function startCamera(){
  startBtn.disabled=true;

  try{
    setStatus("正在開啟後置鏡頭...");

    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("瀏覽器不支援相機，請使用 HTTPS");
    }

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    video.srcObject=stream;
    await video.play();

    setStatus("正在載入 OpenCV...");
    await waitCV();

    setStatus("正在載入 OCR 模型...");

    worker=await Tesseract.createWorker("eng",1,{
      workerPath:"https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js",
      corePath:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core.wasm.js",
      langPath:"https://tessdata.projectnaptha.com/4.0.0"
    });

    await worker.setParameters({
      tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
    });

    scanning=true;
    startBtn.textContent="鏡頭已開啟，自動辨識中";
    setStatus("載入完成，開始掃描！");

    scan();

    setInterval(scan,2500);

  }catch(e){
    console.error(e);
    setStatus("啟動失敗："+e.message);
    startBtn.disabled=false;
  }
}

startBtn.addEventListener("click",startCamera);
</script>

</body>
</html>
