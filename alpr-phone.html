
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣車牌辨識 - 手機端</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  margin: 0;
  padding: 15px;
}
h2 { color: #60d5ff; }
.panel {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin: 12px auto;
  max-width: 650px;
}
#videoBox {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: auto;
}
video, #overlay {
  width: 100%;
  border-radius: 10px;
}
#overlay {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}
button {
  padding: 12px 18px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  background: #0284c7;
  color: white;
  font-size: 16px;
}
#plate {
  font-size: 32px;
  color: #facc15;
  font-weight: bold;
  letter-spacing: 3px;
}
.small { color: #cbd5e1; font-size: 14px; }
#crop {
  max-width: 100%;
  max-height: 140px;
  background: white;
  margin-top: 8px;
}
</style>
</head>
<body>

<h2>台灣車牌即時辨識系統</h2>

<div class="panel">
  <p>MQTT：<span id="mqttStatus">連線中...</span></p>
  <p>OpenCV：<span id="cvStatus">載入中...</span></p>
  <p>OCR：<span id="ocrStatus">尚未載入</span></p>
</div>

<div class="panel">
  <div id="videoBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <br>
  <button onclick="startCamera()">開啟後置鏡頭</button>
  <button onclick="stopCamera()">停止鏡頭</button>
  <button onclick="startRecognition()">開始辨識</button>
  <button onclick="stopRecognition()">停止辨識</button>
</div>

<div class="panel">
  <p>目前最大車牌辨識結果</p>
  <div id="plate">等待辨識</div>
  <p id="confidence">信心分數：--</p>
  <p id="bbox">車牌座標：--</p>
  <p id="area">車牌面積：--</p>
  <p id="message" class="small">請開啟鏡頭</p>
  <p>車牌裁切預覽：</p>
  <canvas id="crop"></canvas>
</div>

<script>
const MQTT_URL = "wss://broker.hivemq.com:8884/mqtt";
const TOPIC = "nutc/alpr/demo01/result";

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");

const cropCanvas = document.getElementById("crop");
const cropCtx = cropCanvas.getContext("2d");

let mqttClient = null;
let cameraStream = null;
let ocrWorker = null;
let cvReady = false;
let ocrReady = false;
let running = false;
let processing = false;
let lastPublished = "";
let lastPublishTime = 0;
let lastDetectionTime = 0;
let deviceId = "phone-" + Math.random().toString(36).slice(2, 9);

function connectMQTT() {
  mqttClient = mqtt.connect(MQTT_URL, {
    clientId: "ALPR_PHONE_" + Math.random().toString(16).slice(2, 10),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  mqttClient.on("connect", () => {
    document.getElementById("mqttStatus").textContent = "已連線";
  });

  mqttClient.on("reconnect", () => {
    document.getElementById("mqttStatus").textContent = "重新連線中";
  });

  mqttClient.on("error", err => {
    document.getElementById("mqttStatus").textContent = "連線錯誤";
    console.error(err);
  });

  mqttClient.on("close", () => {
    document.getElementById("mqttStatus").textContent = "未連線";
  });
}

async function startCamera() {
  try {
    if (cameraStream) stopCamera();

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = cameraStream;
    await video.play();

    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;

    document.getElementById("message").textContent =
      "後置鏡頭已開啟";

  } catch (err) {
    alert("無法開啟鏡頭：" + err.message);
  }
}

function stopCamera() {
  stopRecognition();

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.srcObject = null;
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  document.getElementById("message").textContent = "鏡頭已停止";
}

async function initOCR() {
  try {
    ocrWorker = await Tesseract.createWorker("eng");

    await ocrWorker.setParameters({
      tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-",
      tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
    });

    ocrReady = true;
    document.getElementById("ocrStatus").textContent = "已載入";
  } catch (err) {
    document.getElementById("ocrStatus").textContent = "載入失敗";
    console.error(err);
  }
}

function initOpenCV() {
  if (typeof cv === "undefined" || !cv.Mat) {
    setTimeout(initOpenCV, 500);
    return;
  }

  cvReady = true;
  document.getElementById("cvStatus").textContent = "已載入";
}

function startRecognition() {
  if (!cameraStream) {
    alert("請先開啟鏡頭");
    return;
  }

  if (!cvReady || !ocrReady) {
    alert("辨識模型尚未載入完成，請稍候");
    return;
  }

  running = true;
  document.getElementById("message").textContent = "正在辨識...";
  processFrame();
}

function stopRecognition() {
  running = false;
  document.getElementById("message").textContent = "已停止辨識";
}

async function processFrame() {
  if (!running || processing) return;
  if (!video.videoWidth || video.readyState < 2) {
    setTimeout(processFrame, 500);
    return;
  }

  processing = true;

  try {
    detectLargestPlate();
  } catch (err) {
    console.error("辨識錯誤：", err);
    document.getElementById("message").textContent =
      "影像處理錯誤：" + err.message;
  } finally {
    processing = false;
    if (running) setTimeout(processFrame, 1000);
  }
}

async function detectLargestPlate() {
  const src = cv.imread(video);
  const gray = new cv.Mat();
  const blurred = new cv.Mat();
  const edges = new cv.Mat();
  const contours = new cv.MatVector();
  const hierarchy = new cv.Mat();

  let best = null;
  let bestArea = 0;
  const candidates = [];

  try {
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
    cv.Canny(blurred, edges, 70, 180);

    const kernel = cv.getStructuringElement(
      cv.MORPH_RECT, new cv.Size(5, 3)
    );

    cv.morphologyEx(edges, edges, cv.MORPH_CLOSE, kernel);
    kernel.delete();

    cv.findContours(
      edges, contours, hierarchy,
      cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE
    );

    for (let i = 0; i < contours.size(); i++) {
      const contour = contours.get(i);
      const perimeter = cv.arcLength(contour, true);
      const approx = new cv.Mat();

      cv.approxPolyDP(
        contour, approx, 0.025 * perimeter, true
      );

      if (approx.rows === 4) {
        const rect = cv.boundingRect(approx);
        const ratio = rect.width / rect.height;
        const area = rect.width * rect.height;
        const imageArea = src.cols * src.rows;

        if (
          ratio >= 2.0 &&
          ratio <= 6.0 &&
          area > imageArea * 0.001 &&
          rect.width > 80 &&
          rect.height > 20
        ) {
          candidates.push({
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            area: area
          });

          if (area > bestArea) {
            bestArea = area;
            best = {
              x: rect.x,
              y: rect.y,
              width: rect.width,
              height: rect.height,
              area: area
            };
          }
        }
      }

      approx.delete();
      contour.delete();
    }

    ctx.clearRect(0, 0, overlay.width, overlay.height);

    // 畫出所有疑似車牌（綠色）
    ctx.strokeStyle = "#00ff88";
    ctx.lineWidth = 3;

    candidates.forEach(p => {
      ctx.strokeRect(p.x, p.y, p.width, p.height);
    });

    if (!best) {
      document.getElementById("message").textContent =
        "目前沒有找到疑似車牌";
      return;
    }

    // 最大車牌使用黃色外框
    ctx.strokeStyle = "#ffea00";
    ctx.lineWidth = 5;
    ctx.strokeRect(
      best.x, best.y, best.width, best.height
    );

    // 裁切時保留一點邊界
    const padX = Math.round(best.width * 0.06);
    const padY = Math.round(best.height * 0.12);

    const x = Math.max(0, best.x - padX);
    const y = Math.max(0, best.y - padY);
    const w = Math.min(src.cols - x, best.width + padX * 2);
    const h = Math.min(src.rows - y, best.height + padY * 2);

    const roi = src.roi(new cv.Rect(x, y, w, h));
    const crop = new cv.Mat();

    cv.resize(
      roi, crop,
      new cv.Size(w * 3, h * 3),
      0, 0, cv.INTER_CUBIC
    );

    cv.imshow(cropCanvas, crop);

    document.getElementById("bbox").textContent =
      `X:${best.x} Y:${best.y} W:${best.width} H:${best.height}`;

    document.getElementById("area").textContent =
      `車牌面積：${best.area} px²`;

    document.getElementById("message").textContent =
      `找到 ${candidates.length} 個候選車牌，選擇最大的一個`;

    // 將裁切影像送給 OCR
    await recognizePlate();

    roi.delete();
    crop.delete();

  } finally {
    src.delete();
    gray.delete();
    blurred.delete();
    edges.delete();
    contours.delete();
    hierarchy.delete();
  }
}

async function recognizePlate() {
  const now = Date.now();

  // 避免 OCR 太頻繁
  if (now - lastDetectionTime < 900) return;
  lastDetectionTime = now;

  try {
    const result = await ocrWorker.recognize(cropCanvas);

    let text = result.data.text
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "");

    const confidence = Number(result.data.confidence || 0);

    // 基本台灣常見車牌格式篩選
    const valid =
      /^[A-Z]{3}[0-9]{4}$/.test(text) ||
      /^[A-Z]{2}[0-9]{4}$/.test(text) ||
      /^[A-Z]{2}[0-9]{3}$/.test(text) ||
      /^[0-9]{3}[A-Z]{2}[0-9]{3}$/.test(text);

    if (!valid || confidence < 25) {
      document.getElementById("plate").textContent =
        text || "無法辨識";

      document.getElementById("confidence").textContent =
        `OCR 信心分數：${confidence.toFixed(1)}%`;

      document.getElementById("message").textContent =
        "已找到車牌候選區域，但文字尚未通過格式篩選";

      return;
    }

    document.getElementById("plate").textContent = text;

    document.getElementById("confidence").textContent =
      `OCR 信心分數：${confidence.toFixed(1)}%`;

    document.getElementById("message").textContent =
      "辨識成功，已傳送至電腦";

    publishResult(text, confidence);

  } catch (err) {
    console.error(err);
    document.getElementById("message").textContent =
      "OCR 辨識失敗";
  }
}

function publishResult(plate, confidence) {
  if (!mqttClient || !mqttClient.connected) return;

  const now = Date.now();

  // 同一車牌兩秒內不重複傳送
  if (
    plate === lastPublished &&
    now - lastPublishTime < 2000
  ) return;

  lastPublished = plate;
  lastPublishTime = now;

  const data = {
    type: "plate",
    plate: plate,
    confidence: Number(confidence.toFixed(1)),
    bbox: {
      x: Number(document.getElementById("bbox").textContent.match(/X:(\d+)/)?.[1] || 0),
      y: Number(document.getElementById("bbox").textContent.match(/Y:(\d+)/)?.[1] || 0),
      width: Number(document.getElementById("bbox").textContent.match(/W:(\d+)/)?.[1] || 0),
      height: Number(document.getElementById("bbox").textContent.match(/H:(\d+)/)?.[1] || 0)
    },
    area: Number(document.getElementById("area").textContent.match(/(\d+)/)?.[1] || 0),
    deviceId: deviceId,
    time: new Date().toISOString()
  };

  mqttClient.publish(
    TOPIC,
    JSON.stringify(data),
    { qos: 0 }
  );
}

connectMQTT();
initOCR();
initOpenCV();
</script>
</body>
</html>
