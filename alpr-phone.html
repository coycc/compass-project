
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手機車牌即時辨識</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#101820;color:white;font-family:Arial,sans-serif}
h2{margin:5px 0 12px}
.panel{background:#1d2b36;padding:13px;border-radius:12px;margin-bottom:12px}
#cameraBox{position:relative;width:100%;background:#000;border-radius:12px;overflow:hidden}
video{width:100%;display:block}
canvas#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
label{display:block;margin:10px 0 5px}
input[type=range]{width:100%}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#1685d5;color:white;font-size:16px;margin-top:8px}
.value{font-size:22px;font-weight:bold;color:#ffe66d;word-break:break-all}
.small{font-size:13px;color:#c7d1d9;line-height:1.6}
.status{color:#8ee7a1}
.warn{color:#ffd166}
</style>
</head>
<body>
<h2>📷 台灣車牌即時辨識</h2>

<div class="panel">
  <div>鏡頭狀態：<span id="cameraStatus" class="warn">正在啟動…</span></div>
  <div>辨識狀態：<span id="scanStatus">等待啟動</span></div>
  <div>MQTT：<span id="mqttStatus" class="warn">連線中…</span></div>
  <div>候選區域：<span id="candidateCount">0</span></div>
</div>

<div id="cameraBox">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div class="panel">
  <div>目前辨識結果</div>
  <div id="plateResult" class="value">尚未辨識</div>
  <div id="confidence" class="small">信心分數：--</div>
  <div id="boxInfo" class="small">車牌框：--</div>
</div>

<div class="panel">
  <label>車牌偵測靈敏度：<b id="sensitivityText">7</b></label>
  <input id="sensitivity" type="range" min="1" max="10" value="7">
  <label>OCR 最低信心分數：<b id="thresholdText">15</b>%</label>
  <input id="threshold" type="range" min="5" max="80" value="15">
  <div class="small">
    靈敏度越高，越容易框選候選區域，但也可能出現較多誤判。
    請讓車牌照片完整出現在鏡頭畫面中，避免反光、模糊及過度傾斜。
  </div>
  <button id="restartCamera">重新開啟後置鏡頭</button>
</div>

<canvas id="workCanvas" style="display:none"></canvas>
<canvas id="cropCanvas" style="display:none"></canvas>

<script>
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
const TOPIC = "nutc/alpr/demo01/result";
const DEVICE_ID = "phone-" + Math.random().toString(16).slice(2,10);

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
const workCanvas = document.getElementById("workCanvas");
const cropCanvas = document.getElementById("cropCanvas");
const cropCtx = cropCanvas.getContext("2d");

const sensitivity = document.getElementById("sensitivity");
const threshold = document.getElementById("threshold");

let stream = null;
let mqttClient = null;
let cvReady = false;
let worker = null;
let ocrReady = false;
let scanning = false;
let ocrBusy = false;
let lastOCR = 0;
let lastPublishPlate = "";
let lastPublishTime = 0;
let selectedBox = null;
let scanTimer = null;

function setText(id, text) {
  document.getElementById(id).textContent = text;
}

sensitivity.addEventListener("input", () => {
  setText("sensitivityText", sensitivity.value);
});
threshold.addEventListener("input", () => {
  setText("thresholdText", threshold.value);
});

function connectMQTT() {
  mqttClient = mqtt.connect(BROKER, {
    clientId: "alpr_phone_" + Math.random().toString(16).slice(2,10),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  mqttClient.on("connect", () => {
    setText("mqttStatus", "已連線");
    document.getElementById("mqttStatus").className = "status";
  });

  mqttClient.on("reconnect", () => {
    setText("mqttStatus", "重新連線中…");
    document.getElementById("mqttStatus").className = "warn";
  });

  mqttClient.on("error", err => {
    setText("mqttStatus", "連線錯誤：" + err.message);
  });
}

async function openCamera() {
  try {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    setText("cameraStatus", "正在開啟後置鏡頭…");

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    await new Promise(resolve => {
      if (video.videoWidth > 0) return resolve();
      video.onloadedmetadata = () => resolve();
    });

    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;

    setText("cameraStatus", "後置鏡頭已開啟");
    document.getElementById("cameraStatus").className = "status";

    beginScanning();
  } catch (err) {
    setText("cameraStatus", "開啟失敗：" + err.message);
    setText("scanStatus", "請確認相機權限，並使用 HTTPS 網址");
  }
}

function beginScanning() {
  if (scanning) return;
  scanning = true;
  setText("scanStatus", "持續掃描中…");

  scanTimer = setInterval(() => {
    if (cvReady && video.readyState >= 2 && !ocrBusy) {
      detectPlate();
    }
  }, 500);
}

function removeDuplicateBoxes(boxes) {
  const result = [];
  for (const b of boxes) {
    const duplicate = result.some(a => {
      const cx1 = a.x + a.width / 2;
      const cy1 = a.y + a.height / 2;
      const cx2 = b.x + b.width / 2;
      const cy2 = b.y + b.height / 2;
      return Math.abs(cx1-cx2) < Math.min(a.width,b.width)*0.35 &&
             Math.abs(cy1-cy2) < Math.min(a.height,b.height)*0.45;
    });
    if (!duplicate) result.push(b);
  }
  return result;
}

function detectPlate() {
  let src, gray, blur, edges, binary, combined, closed, contours, hierarchy, kernel;

  try {
    src = cv.imread(video);
    gray = new cv.Mat();
    blur = new cv.Mat();
    edges = new cv.Mat();
    binary = new cv.Mat();
    combined = new cv.Mat();
    closed = new cv.Mat();
    contours = new cv.MatVector();
    hierarchy = new cv.Mat();

    const level = Number(sensitivity.value);
    const totalArea = src.cols * src.rows;

    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blur, new cv.Size(3,3), 0);

    const low = Math.max(10, 75 - level * 6);
    const high = Math.max(45, 180 - level * 10);
    cv.Canny(blur, edges, low, high);

    cv.adaptiveThreshold(
      blur, binary, 255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY, 21, 7
    );

    cv.bitwise_or(edges, binary, combined);

    kernel = cv.getStructuringElement(
      cv.MORPH_RECT, new cv.Size(9,3)
    );
    cv.morphologyEx(combined, closed, cv.MORPH_CLOSE, kernel);

    cv.findContours(
      closed, contours, hierarchy,
      cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE
    );

    let boxes = [];
    const minArea = totalArea * (0.00012 + (10-level)*0.00004);
    const minWidth = 35 + (10-level)*2;

    for (let i=0; i<contours.size(); i++) {
      const contour = contours.get(i);
      const r = cv.boundingRect(contour);
      const ratio = r.width / Math.max(r.height,1);
      const area = r.width * r.height;

      if (
        area >= minArea &&
        r.width >= minWidth &&
        r.height >= 12 &&
        ratio >= 1.35 &&
        ratio <= 8.5
      ) {
        boxes.push({
          x:r.x, y:r.y, width:r.width, height:r.height, area
        });
      }
      contour.delete();
    }

    boxes.sort((a,b) => b.area-a.area);
    boxes = removeDuplicateBoxes(boxes).slice(0,15);

    if (overlay.width !== video.videoWidth ||
        overlay.height !== video.videoHeight) {
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
    }

    ctx.clearRect(0,0,overlay.width,overlay.height);
    setText("candidateCount", boxes.length);

    if (!boxes.length) {
      selectedBox = null;
      setText("scanStatus", "掃描中，尚未找到候選車牌");
      return;
    }

    ctx.lineWidth = 3;
    ctx.strokeStyle = "#00ff55";
    boxes.forEach(b => {
      ctx.strokeRect(b.x,b.y,b.width,b.height);
    });

    const best = boxes[0];
    selectedBox = best;

    ctx.lineWidth = 5;
    ctx.strokeStyle = "#ffff00";
    ctx.strokeRect(best.x,best.y,best.width,best.height);

    setText("scanStatus", "找到候選區域，正在辨識…");
    setText(
      "boxInfo",
      `X:${best.x} Y:${best.y} 寬:${best.width} 高:${best.height}`
    );

    if (Date.now() - lastOCR > 1400 && !ocrBusy) {
      lastOCR = Date.now();
      prepareCrop(best);
      recognizePlate();
    }

  } catch (err) {
    console.error("偵測錯誤", err);
    setText("scanStatus", "影像分析錯誤：" + err.message);
  } finally {
    [src,gray,blur,edges,binary,combined,closed,
     contours,hierarchy,kernel].forEach(m => {
      if (m && !m.isDeleted()) m.delete();
    });
  }
}

function prepareCrop(b) {
  const padX = Math.round(b.width * 0.12);
  const padY = Math.round(b.height * 0.25);

  const x = Math.max(0, b.x-padX);
  const y = Math.max(0, b.y-padY);
  const right = Math.min(video.videoWidth, b.x+b.width+padX);
  const bottom = Math.min(video.videoHeight, b.y+b.height+padY);

  const w = Math.max(1,right-x);
  const h = Math.max(1,bottom-y);

  cropCanvas.width = w*3;
  cropCanvas.height = h*3;

  cropCtx.fillStyle = "white";
  cropCtx.fillRect(0,0,cropCanvas.width,cropCanvas.height);
  cropCtx.drawImage(video,x,y,w,h,0,0,cropCanvas.width,cropCanvas.height);
}

function cleanPlate(text) {
  return text.toUpperCase()
    .replace(/[^A-Z0-9]/g,"")
    .replace(/[IL|]/g,"1")
    .replace(/O/g,"0");
}

async function recognizePlate() {
  if (!worker || !ocrReady || ocrBusy) return;
  ocrBusy = true;

  try {
    const result = await worker.recognize(cropCanvas);
    const raw = result.data.text || "";
    const plate = cleanPlate(raw);
    const confidence = Number(result.data.confidence || 0);

    if (plate.length >= 5) {
      setText("plateResult", plate);
      setText("confidence", "信心分數：" + confidence.toFixed(1) + "%");

      if (confidence >= Number(threshold.value)) {
        setText("scanStatus", "已取得辨識結果");
        publishResult(plate, confidence);
      } else {
        setText("scanStatus", "已讀取文字，但信心分數低於門檻");
      }
    } else {
      setText("scanStatus", "已找到候選區域，文字尚不清楚");
    }
  } catch (err) {
    console.error("OCR錯誤",err);
    setText("scanStatus","OCR辨識發生錯誤");
  } finally {
    ocrBusy = false;
  }
}

function publishResult(plate, confidence) {
  if (!mqttClient || !mqttClient.connected) return;

  const now = Date.now();
  if (plate === lastPublishPlate && now-lastPublishTime < 5000) return;

  const b = selectedBox;
  const message = {
    type: "license_plate",
    plate: plate,
    confidence: Number(confidence.toFixed(1)),
    bbox: b ? {
      x:b.x, y:b.y, width:b.width, height:b.height,
      imageWidth:video.videoWidth,
      imageHeight:video.videoHeight
    } : null,
    deviceId: DEVICE_ID,
    time: new Date().toISOString()
  };

  mqttClient.publish(TOPIC, JSON.stringify(message), {qos:0});
  lastPublishPlate = plate;
  lastPublishTime = now;
}

async function initializeOCR() {
  try {
    setText("scanStatus","正在載入 OCR 模型…");
    worker = await Tesseract.createWorker("eng", 1, {
      logger: m => {
        if (m.status === "recognizing text") {
          setText("scanStatus","OCR辨識中 " + Math.round(m.progress*100) + "%");
        }
      }
    });

    await worker.setParameters({
      tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
      tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
    });

    ocrReady = true;
    setText("scanStatus","OCR模型載入完成，等待掃描");
  } catch (err) {
    setText("scanStatus","OCR模型載入失敗：" + err.message);
  }
}

function waitForOpenCV() {
  const timer = setInterval(() => {
    if (window.cv && cv.Mat) {
      clearInterval(timer);
      cvReady = true;
      setText("scanStatus","OpenCV載入完成，等待掃描");
    }
  },300);

  setTimeout(() => {
    if (!cvReady) setText("scanStatus","OpenCV載入失敗，請重新整理網頁");
  },30000);
}

document.getElementById("restartCamera").addEventListener("click",openCamera);

connectMQTT();
waitForOpenCV();
initializeOCR();

// 網頁開啟後自動要求相機權限並啟動後置鏡頭
window.addEventListener("load", () => {
  openCamera();
});
</script>
</body>
</html>
