
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手機 AI 物件識別 MQTT</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 15px;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h2 { margin-bottom: 8px; }

.camera {
    position: relative;
    max-width: 600px;
    margin: 15px auto;
    background: black;
    border-radius: 12px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

button {
    padding: 13px 22px;
    border: 0;
    border-radius: 8px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
}

#start { background: #16a34a; color: white; }
#stop { background: #dc2626; color: white; }

button:disabled { opacity: .4; }

.panel {
    max-width: 600px;
    margin: 15px auto;
    background: #1e293b;
    border-radius: 12px;
    padding: 15px;
    text-align: left;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.green { color: #4ade80; }
.yellow { color: #facc15; }

</style>
</head>

<body>

<h2>📷 手機 AI 即時物件識別</h2>
<p>COCO-SSD + MQTT.js</p>

<div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<button id="start" onclick="startSystem()">開始辨識</button>
<button id="stop" onclick="stopSystem()" disabled>停止辨識</button>

<div class="panel">
    <div>AI 模型：<span id="modelStatus" class="yellow">尚未載入</span></div>
    <div>MQTT：<span id="mqttStatus" class="yellow">未連線</span></div>
    <div>辨識狀態：<span id="detectStatus">停止</span></div>
    <div>辨識物件數量：<span id="count">0</span></div>
    <div>發布次數：<span id="sent">0</span></div>
    <hr>
    <b>辨識結果：</b>
    <div id="results">尚未開始</div>
</div>

<script>

// ============================
// MQTT 設定
// ============================

const BROKER = "wss://broker.hivemq.com:8884/mqtt";

const TOPIC = "nutc/im/object-detection/demo01";

const clientId = "object_phone_" +
    Math.random().toString(16).slice(2, 10);

let mqttClient = null;
let model = null;
let stream = null;
let running = false;

let sentCount = 0;
let lastPublish = 0;

const THRESHOLD = 0.50;
const PUBLISH_INTERVAL = 200;

// ============================
// HTML 元素
// ============================

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// ============================
// MQTT 連線
// ============================

function connectMQTT() {

    return new Promise((resolve, reject) => {

        if (mqttClient && mqttClient.connected) {
            resolve();
            return;
        }

        document.getElementById("mqttStatus").innerText =
            "連線中...";

        mqttClient = mqtt.connect(BROKER, {

            clientId: clientId,

            clean: true,

            connectTimeout: 10000,

            reconnectPeriod: 3000,

            keepalive: 30

        });

        mqttClient.on("connect", () => {

            document.getElementById("mqttStatus").innerText =
                "已連線";

            document.getElementById("mqttStatus").className =
                "green";

            resolve();

        });

        mqttClient.on("reconnect", () => {

            document.getElementById("mqttStatus").innerText =
                "重新連線中...";

        });

        mqttClient.on("offline", () => {

            document.getElementById("mqttStatus").innerText =
                "離線";

        });

        mqttClient.on("error", error => {

            console.error("MQTT Error:", error);

            document.getElementById("mqttStatus").innerText =
                "連線錯誤";

            reject(error);

        });

        mqttClient.on("close", () => {

            document.getElementById("mqttStatus").innerText =
                "連線關閉";

        });

    });
}

// ============================
// 載入 AI 模型
// ============================

async function loadModel() {

    if (model) return;

    document.getElementById("modelStatus").innerText =
        "載入中...";

    await tf.ready();

    model = await cocoSsd.load({
        base: "lite_mobilenet_v2"
    });

    document.getElementById("modelStatus").innerText =
        "載入完成";

    document.getElementById("modelStatus").className =
        "green";
}

// ============================
// 啟動系統
// ============================

async function startSystem() {

    if (running) return;

    try {

        document.getElementById("start").disabled = true;

        // MQTT 連線
        await connectMQTT();

        // 載入模型
        await loadModel();

        // 開啟後置鏡頭
        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },

            audio: false

        });

        video.srcObject = stream;

        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        running = true;

        document.getElementById("start").disabled = true;
        document.getElementById("stop").disabled = false;

        document.getElementById("detectStatus").innerText =
            "正在辨識";

        detectLoop();

    } catch (error) {

        console.error(error);

        alert("啟動失敗：" + error.message);

        stopSystem();

    }

}

// ============================
// 辨識迴圈
// ============================

async function detectLoop() {

    while (running) {

        try {

            const predictions = await model.detect(video);

            if (!running) break;

            const detected = predictions.filter(
                p => p.score >= THRESHOLD
            );

            drawBoxes(detected);

            showResults(detected);

            document.getElementById("count").innerText =
                detected.length;

            // MQTT 每 200ms 發布一次
            const now = Date.now();

            if (now - lastPublish >= PUBLISH_INTERVAL) {

                publishObjects(detected);

                lastPublish = now;

            }

        } catch (error) {

            console.error(error);

            document.getElementById("detectStatus").innerText =
                "辨識錯誤";

            break;

        }

        // 避免過度占用手機
        await new Promise(resolve => setTimeout(resolve, 50));

    }

}

// ============================
// 畫出手機端方框
// ============================

function drawBoxes(objects) {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    objects.forEach(obj => {

        const [x, y, w, h] = obj.bbox;

        const score = (obj.score * 100).toFixed(1);

        const label = obj.class + " " + score + "%";

        ctx.strokeStyle = "#00ff66";
        ctx.lineWidth = 3;

        ctx.strokeRect(x, y, w, h);

        ctx.font = "bold 18px Arial";

        const tw = ctx.measureText(label).width;

        const labelY = Math.max(22, y);

        ctx.fillStyle = "#00aa55";

        ctx.fillRect(
            x,
            labelY - 25,
            tw + 12,
            26
        );

        ctx.fillStyle = "white";

        ctx.fillText(label, x + 6, labelY - 7);

    });

}

// ============================
// 顯示手機辨識清單
// ============================

function showResults(objects) {

    const area = document.getElementById("results");

    if (objects.length === 0) {

        area.innerText = "沒有偵測到物件";

        return;
    }

    area.innerHTML = objects.map(obj => {

        return `
            <div>
                🟢 ${obj.class}：
                ${(obj.score * 100).toFixed(1)}%
            </div>
        `;

    }).join("");

}

// ============================
// 發布 MQTT JSON
// ============================

function publishObjects(objects) {

    if (!mqttClient || !mqttClient.connected) {
        return;
    }

    // 將 bbox 正規化為 0~1
    const data = {

        deviceId: clientId,

        event: "detection",

        timestamp: Date.now(),

        frameWidth: canvas.width,

        frameHeight: canvas.height,

        count: objects.length,

        objects: objects.map(obj => {

            const [x, y, w, h] = obj.bbox;

            return {

                name: obj.class,

                confidence: Number(obj.score.toFixed(4)),

                // 正規化座標，PC 可依畫布大小重建
                bbox: {

                    x: x / canvas.width,

                    y: y / canvas.height,

                    width: w / canvas.width,

                    height: h / canvas.height

                },

                // 原始像素座標
                bboxPixels: {
                    x, y, width: w, height: h
                }

            };

        })

    };

    mqttClient.publish(

        TOPIC,

        JSON.stringify(data),

        { qos: 0, retain: false },

        error => {

            if (!error) {

                sentCount++;

                document.getElementById("sent").innerText =
                    sentCount;

            } else {

                console.error("發布失敗", error);

            }

        }

    );

}

// ============================
// 停止系統
// ============================

function stopSystem() {

    if (running && mqttClient && mqttClient.connected) {

        mqttClient.publish(TOPIC, JSON.stringify({

            deviceId: clientId,

            event: "stopped",

            timestamp: Date.now(),

            count: 0,

            objects: []

        }), { qos: 0, retain: false });

    }

    running = false;

    if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;

    }

    video.srcObject = null;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    document.getElementById("count").innerText = 0;

    document.getElementById("detectStatus").innerText =
        "已停止";

    document.getElementById("results").innerText =
        "辨識已停止";

    document.getElementById("start").disabled = false;

    document.getElementById("stop").disabled = true;

}

</script>

</body>
</html>
