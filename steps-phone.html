
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手機加速度與計步器</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #101827;
      color: white;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1 { text-align: center; font-size: 25px; }

    .card {
      background: #1d2a40;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      background: #34445e;
      text-align: center;
    }

    .steps {
      text-align: center;
      font-size: 70px;
      font-weight: bold;
      color: #43e0a1;
      margin: 10px 0;
    }

    .accel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .accel-box {
      background: #293b58;
      padding: 12px 5px;
      text-align: center;
      border-radius: 10px;
    }

    .accel-value {
      display: block;
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
      color: #73c7ff;
      overflow-wrap: anywhere;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 9px;
    }

    .start { background: #20bb80; color: white; }
    .stop { background: #e45d5d; color: white; }
    .reset { background: #e6a33b; color: white; }

    input[type="range"] { width: 100%; }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      margin-top: 8px;
    }

    .small {
      font-size: 13px;
      color: #c3cee0;
      line-height: 1.6;
    }

    .value {
      color: #43e0a1;
      font-weight: bold;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>📱 手機加速度與計步器</h1>

  <div class="card">
    <div class="status" id="mqttStatus">MQTT 連線中...</div>
    <p class="small">步數 Topic：nutc/im/1411331040/steps</p>
    <p class="small">加速度 Topic：classroom/accelerometer/phone01</p>
  </div>

  <div class="card">
    <h2>🚶 累計步數</h2>
    <div class="steps" id="steps">0</div>
    <p style="text-align:center;">目前累計步數</p>
  </div>

  <div class="card">
    <h2>📊 線性加速度</h2>

    <div class="accel-grid">
      <div class="accel-box">
        X 軸
        <span class="accel-value" id="ax">0.00</span>
      </div>

      <div class="accel-box">
        Y 軸
        <span class="accel-value" id="ay">0.00</span>
      </div>

      <div class="accel-box">
        Z 軸
        <span class="accel-value" id="az">0.00</span>
      </div>
    </div>

    <p style="text-align:center;">
      加速度大小：
      <span class="value" id="magnitude">0.00</span> m/s²
    </p>

    <p class="small" id="sensorStatus">感測器尚未啟動</p>
  </div>

  <div class="card">
    <h2>⚙️ 計步設定</h2>

    <label for="deviceId">裝置 ID</label>
    <input type="text" id="deviceId" value="phone01" maxlength="40">

    <p>
      計步靈敏度：
      <span class="value" id="sensitivityText">1.0</span>
    </p>

    <input
      type="range"
      id="sensitivity"
      min="0.5"
      max="2"
      step="0.1"
      value="1"
    >

    <p class="small">
      數值越大，越容易偵測到步伐。
    </p>
  </div>

  <div class="card">
    <h2>🎮 操作</h2>

    <button class="start" id="startBtn">▶ 開始感測與計步</button>
    <button class="stop" id="stopBtn">⏸ 停止計步</button>
    <button class="reset" id="resetBtn">↻ 步數歸零</button>

    <p class="small" id="trackingStatus">目前狀態：尚未開始</p>
  </div>

</div>

<script>
// ========================================
// 1. MQTT 設定
// ========================================

const MQTT_URL = "wss://broker.hivemq.com:8884/mqtt";
const ACCEL_TOPIC = "classroom/accelerometer/phone01";
const STEP_TOPIC = "nutc/im/1411331040/steps";

let mqttClient = null;

const pendingMessages = [];
const MAX_PENDING = 200;

const mqttStatus = document.getElementById("mqttStatus");

function setMqttStatus(message, color) {
  mqttStatus.textContent = message;
  mqttStatus.style.background = color;
}

function connectMQTT() {
  if (typeof mqtt === "undefined") {
    setMqttStatus("MQTT 程式載入失敗，請檢查網路", "#803737");
    return;
  }

  mqttClient = mqtt.connect(MQTT_URL, {
    clientId: "steps_phone_" + Math.random().toString(16).slice(2),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  mqttClient.on("connect", () => {
    setMqttStatus("✅ MQTT 已連線", "#176b50");

    while (pendingMessages.length > 0 && mqttClient.connected) {
      const item = pendingMessages.shift();
      mqttClient.publish(item.topic, item.message);
    }
  });

  mqttClient.on("reconnect", () => {
    setMqttStatus("正在重新連線...", "#80642b");
  });

  mqttClient.on("offline", () => {
    setMqttStatus("MQTT 離線，重要事件暫存中", "#803737");
  });

  mqttClient.on("error", error => {
    console.error("MQTT 錯誤：", error);
    setMqttStatus("MQTT 連線發生錯誤", "#803737");
  });
}

connectMQTT();

function getDeviceId() {
  return document.getElementById("deviceId").value.trim() || "phone01";
}

// 發布重要步數事件；離線時暫存
function publishImportant(topic, data) {
  const message = JSON.stringify(data);

  if (mqttClient && mqttClient.connected) {
    mqttClient.publish(topic, message);
  } else {
    if (pendingMessages.length >= MAX_PENDING) {
      pendingMessages.shift();
    }

    pendingMessages.push({ topic, message });
  }
}

// 發布加速度資料
function publishAcceleration(x, y, z, total) {
  if (!mqttClient || !mqttClient.connected) return;

  const data = {
    x: Number(x.toFixed(3)),
    y: Number(y.toFixed(3)),
    z: Number(z.toFixed(3)),
    total: Number(total.toFixed(3)),
    device_id: getDeviceId(),
    timestamp: new Date().toISOString(),
    unit: "m/s2"
  };

  mqttClient.publish(ACCEL_TOPIC, JSON.stringify(data));
}

// 發布步數資料
function publishStep(eventType) {
  publishImportant(STEP_TOPIC, {
    steps: steps,
    device_id: getDeviceId(),
    timestamp: new Date().toISOString(),
    event_type: eventType
  });
}

// ========================================
// 2. 計步器變數
// ========================================

let steps = 0;
let tracking = false;
let starting = false;

let lastStepTime = 0;
let lastSensorTime = 0;
let lastSensorEventTime = 0;
let lastAccelPublish = 0;

let gravity = null;
let baselineMagnitude = null;
let smoothSignal = 0;
let armed = true;

let publishTimer = null;
let sensorWarningTimer = null;

const stepsDisplay = document.getElementById("steps");
const sensorStatus = document.getElementById("sensorStatus");
const trackingStatus = document.getElementById("trackingStatus");

function updateSteps() {
  stepsDisplay.textContent = String(steps);
}

// 靈敏度越高，偵測門檻越低
function getThreshold() {
  const sensitivity = Number(
    document.getElementById("sensitivity").value
  );

  return 1.4 / sensitivity;
}

document.getElementById("sensitivity").addEventListener("input", () => {
  document.getElementById("sensitivityText").textContent =
    Number(document.getElementById("sensitivity").value).toFixed(1);
});

// 確認 XYZ 數值有效
function validXYZ(value) {
  return value &&
    Number.isFinite(value.x) &&
    Number.isFinite(value.y) &&
    Number.isFinite(value.z);
}

// ========================================
// 3. 手機感測器與計步函數
// ========================================

function handleMotion(event) {
  if (!tracking) return;

  const now = Date.now();

  const dt = lastSensorTime
    ? Math.max(0.005, Math.min((now - lastSensorTime) / 1000, 0.2))
    : 0.02;

  lastSensorTime = now;
  lastSensorEventTime = now;

  let x;
  let y;
  let z;

  // 優先使用不含重力的線性加速度
  if (validXYZ(event.acceleration)) {
    x = event.acceleration.x;
    y = event.acceleration.y;
    z = event.acceleration.z;

    sensorStatus.textContent = "✅ 使用手機線性加速度（不含重力）";

  } else if (validXYZ(event.accelerationIncludingGravity)) {

    // 沒有線性加速度時，估算重力並扣除
    const raw = event.accelerationIncludingGravity;
    const gravityAlpha = 1 - Math.exp(-dt / 0.8);

    if (gravity === null) {
      gravity = {
        x: raw.x,
        y: raw.y,
        z: raw.z
      };
    } else {
      gravity.x += gravityAlpha * (raw.x - gravity.x);
      gravity.y += gravityAlpha * (raw.y - gravity.y);
      gravity.z += gravityAlpha * (raw.z - gravity.z);
    }

    x = raw.x - gravity.x;
    y = raw.y - gravity.y;
    z = raw.z - gravity.z;

    sensorStatus.textContent = "✅ 已使用估算方式扣除重力";

  } else {
    sensorStatus.textContent = "❌ 感測器沒有提供有效的 XYZ 資料";
    return;
  }

  // 過濾極小的感測器雜訊
  const DEAD_ZONE = 0.05;

  if (Math.abs(x) < DEAD_ZONE) x = 0;
  if (Math.abs(y) < DEAD_ZONE) y = 0;
  if (Math.abs(z) < DEAD_ZONE) z = 0;

  // 計算線性加速度大小
  const magnitude = Math.sqrt(x * x + y * y + z * z);

  // 更新手機畫面
  document.getElementById("ax").textContent = x.toFixed(2);
  document.getElementById("ay").textContent = y.toFixed(2);
  document.getElementById("az").textContent = z.toFixed(2);
  document.getElementById("magnitude").textContent = magnitude.toFixed(2);

  // 每 100ms 傳送一次加速度
  if (now - lastAccelPublish >= 100) {
    publishAcceleration(x, y, z, magnitude);
    lastAccelPublish = now;
  }

  // ======================================
  // 計步演算法
  // ======================================

  const baselineAlpha = 1 - Math.exp(-dt / 1.0);

  // 第一次收到資料，建立基準值
  if (baselineMagnitude === null) {
    baselineMagnitude = magnitude;
    smoothSignal = 0;
    return;
  }

  // 慢速更新基準值
  baselineMagnitude +=
    baselineAlpha * (magnitude - baselineMagnitude);

  // 移除基準值，取得變動量
  const signal = magnitude - baselineMagnitude;

  // 平滑加速度變化
  smoothSignal = smoothSignal * 0.55 + signal * 0.45;

  const threshold = getThreshold();

  // 偵測明顯的正向波峰
  if (
    smoothSignal > threshold &&
    armed &&
    now - lastStepTime >= 300
  ) {
    steps++;
    updateSteps();

    lastStepTime = now;
    armed = false;

    // 每增加一步，立即發布
    publishStep("step");
  }

  // 加速度回落，準備偵測下一步
  if (smoothSignal < threshold * 0.2) {
    armed = true;
  }
}

// ========================================
// 4. 開始計步
// ========================================

async function startTracking() {
  if (tracking || starting) return;

  if (!window.isSecureContext) {
    alert("請使用 HTTPS 網址開啟，例如 GitHub Pages。");
    return;
  }

  if (!("DeviceMotionEvent" in window)) {
    alert("目前瀏覽器不支援手機動作感測器。");
    return;
  }

  starting = true;

  try {
    // iPhone Safari 必須由按鈕觸發權限請求
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      const permission = await DeviceMotionEvent.requestPermission();

      if (permission !== "granted") {
        alert("請允許動作與方向感測器權限。");
        return;
      }
    }

    // 重設感測器基準
    gravity = null;
    baselineMagnitude = null;
    smoothSignal = 0;

    lastStepTime = 0;
    lastSensorTime = 0;
    lastSensorEventTime = 0;
    lastAccelPublish = 0;
    armed = true;

    tracking = true;

    window.addEventListener("devicemotion", handleMotion, true);

    trackingStatus.textContent = "目前狀態：計步中";
    sensorStatus.textContent = "等待手機感測器資料...";

    publishStep("start");

    // 每 5 秒發布目前步數
    clearInterval(publishTimer);

    publishTimer = setInterval(() => {
      if (tracking) {
        publishStep("step_count");
      }
    }, 5000);

    // 檢查是否收到感測器資料
    clearTimeout(sensorWarningTimer);

    sensorWarningTimer = setTimeout(() => {
      if (tracking && lastSensorEventTime === 0) {
        sensorStatus.textContent =
          "⚠️ 尚未收到感測器資料，請檢查手機權限";
      }
    }, 4000);

  } catch (error) {
    console.error("啟動感測器失敗：", error);
    alert("啟動感測器失敗：" + error.message);

  } finally {
    starting = false;
  }
}

// ========================================
// 5. 停止計步
// ========================================

function stopTracking() {
  if (!tracking) return;

  tracking = false;

  window.removeEventListener("devicemotion", handleMotion, true);

  clearInterval(publishTimer);
  clearTimeout(sensorWarningTimer);

  trackingStatus.textContent = "目前狀態：已停止";
  sensorStatus.textContent = "感測器已停止";

  publishStep("stop");
}

// ========================================
// 6. 步數歸零
// ========================================

function resetSteps() {
  steps = 0;
  updateSteps();

  baselineMagnitude = null;
  smoothSignal = 0;
  armed = true;

  lastStepTime = Date.now();

  publishStep("reset");
}

// ========================================
// 7. 按鈕
// ========================================

document.getElementById("startBtn")
  .addEventListener("click", startTracking);

document.getElementById("stopBtn")
  .addEventListener("click", stopTracking);

document.getElementById("resetBtn")
  .addEventListener("click", resetSteps);

updateSteps();

</script>
</body>
</html>
