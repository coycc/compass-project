<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手機加速度與計步器</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, "Noto Sans TC", sans-serif;
  background: #101827;
  color: white;
}

.container {
  max-width: 520px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 25px;
}

.card {
  background: #1d2a40;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 15px;
}

.status {
  padding: 10px;
  border-radius: 8px;
  background: #34445e;
  text-align: center;
  font-size: 14px;
}

.steps {
  text-align: center;
  font-size: 70px;
  font-weight: bold;
  color: #43e0a1;
  margin: 10px 0;
}

.accel-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.accel-box {
  background: #293b58;
  padding: 12px 5px;
  text-align: center;
  border-radius: 10px;
}

.accel-value {
  display: block;
  font-size: 22px;
  font-weight: bold;
  margin-top: 8px;
  color: #73c7ff;
  word-break: break-all;
}

button {
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  margin-top: 9px;
}

.start { background: #20bb80; color: white; }
.stop { background: #e45d5d; color: white; }
.reset { background: #e6a33b; color: white; }

input[type="range"] {
  width: 100%;
}

input[type="text"] {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
  margin-top: 8px;
}

.small {
  font-size: 13px;
  color: #c3cee0;
  line-height: 1.6;
}

.value {
  color: #43e0a1;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📱 手機加速度與計步器</h1>

<div class="card">
  <div class="status" id="mqttStatus">MQTT 連線中...</div>
  <p class="small">步數主題：nutc/im/1411331040/steps</p>
  <p class="small">加速度主題：classroom/accelerometer/phone01</p>
</div>

<div class="card">
  <h2>🚶 累計步數</h2>
  <div class="steps" id="steps">0</div>
  <p style="text-align:center;">目前累計步數</p>
</div>

<div class="card">
  <h2>📊 線性加速度</h2>

  <div class="accel-grid">
    <div class="accel-box">
      X 軸
      <span class="accel-value" id="ax">0.00</span>
    </div>

    <div class="accel-box">
      Y 軸
      <span class="accel-value" id="ay">0.00</span>
    </div>

    <div class="accel-box">
      Z 軸
      <span class="accel-value" id="az">0.00</span>
    </div>
  </div>

  <p style="text-align:center;">
    加速度大小：
    <span class="value" id="magnitude">0.00</span> m/s²
  </p>

  <p class="small" id="sensorStatus">感測器尚未啟動</p>
</div>

<div class="card">
  <h2>⚙️ 計步設定</h2>

  <p>裝置 ID</p>
  <input type="text" id="deviceId" value="phone01">

  <p>計步靈敏度：<span class="value" id="sensitivityText">1.0</span></p>

  <input
    type="range"
    id="sensitivity"
    min="0.5"
    max="2"
    step="0.1"
    value="1"
  >

  <p class="small">
    數值越大越敏感，越容易偵測到步伐。
  </p>
</div>

<div class="card">
  <h2>🎮 操作</h2>

  <button class="start" id="startBtn">▶ 開始計步</button>
  <button class="stop" id="stopBtn">⏸ 停止計步</button>
  <button class="reset" id="resetBtn">↻ 步數歸零</button>

  <p class="small" id="trackingStatus">目前狀態：尚未開始</p>
</div>

</div>

<script>
// ========================================
// MQTT 設定
// ========================================

const MQTT_URL = "wss://broker.hivemq.com:8884/mqtt";

const ACCEL_TOPIC = "classroom/accelerometer/phone01";
const STEP_TOPIC = "nutc/im/1411331040/steps";

let mqttClient = null;

const mqttStatus = document.getElementById("mqttStatus");

function connectMQTT() {
  mqttClient = mqtt.connect(MQTT_URL, {
    clientId: "steps_phone_" + Math.random().toString(16).slice(2),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  mqttClient.on("connect", () => {
    mqttStatus.textContent = "✅ MQTT 已連線";
    mqttStatus.style.background = "#176b50";
  });

  mqttClient.on("reconnect", () => {
    mqttStatus.textContent = "正在重新連線...";
    mqttStatus.style.background = "#80642b";
  });

  mqttClient.on("offline", () => {
    mqttStatus.textContent = "MQTT 離線";
    mqttStatus.style.background = "#803737";
  });

  mqttClient.on("error", (error) => {
    console.error("MQTT 錯誤：", error);
    mqttStatus.textContent = "MQTT 連線發生錯誤";
  });
}

connectMQTT();

function getDeviceId() {
  return document.getElementById("deviceId").value.trim() || "phone01";
}

// 發布步數事件
function publishStep(eventType) {
  if (!mqttClient || !mqttClient.connected) {
    console.warn("MQTT 尚未連線，無法發布步數");
    return;
  }

  const data = {
    steps: steps,
    device_id: getDeviceId(),
    timestamp: new Date().toISOString(),
    event_type: eventType
  };

  mqttClient.publish(STEP_TOPIC, JSON.stringify(data));
}

// 發布加速度
function publishAcceleration(x, y, z, total) {
  if (!mqttClient || !mqttClient.connected) return;

  const data = {
    x: Number(x.toFixed(3)),
    y: Number(y.toFixed(3)),
    z: Number(z.toFixed(3)),
    total: Number(total.toFixed(3)),
    device_id: getDeviceId(),
    timestamp: new Date().toISOString(),
    unit: "m/s2"
  };

  mqttClient.publish(ACCEL_TOPIC, JSON.stringify(data));
}

// ========================================
// 計步器
// ========================================

let steps = 0;
let tracking = false;

let lastStepTime = 0;
let armed = true;

let lastSensorTime = 0;
let gravity = null;
let smoothMagnitude = 0;

let publishTimer = null;
let sensorWarningTimer = null;
let lastSensorEventTime = 0;

const stepsDisplay = document.getElementById("steps");
const sensorStatus = document.getElementById("sensorStatus");
const trackingStatus = document.getElementById("trackingStatus");

function updateSteps() {
  stepsDisplay.textContent = steps;
}

function getThreshold() {
  const sensitivity = Number(
    document.getElementById("sensitivity").value
  );

  // 靈敏度越高，門檻越低
  return 1.8 / sensitivity;
}

document.getElementById("sensitivity").addEventListener("input", () => {
  document.getElementById("sensitivityText").textContent =
    Number(document.getElementById("sensitivity").value).toFixed(1);
});

// 檢查 XYZ 是否為有效數值
function validXYZ(obj) {
  return obj &&
    Number.isFinite(obj.x) &&
    Number.isFinite(obj.y) &&
    Number.isFinite(obj.z);
}

// ========================================
// 感測器事件
// ========================================

function handleMotion(event) {
  if (!tracking) return;

  lastSensorEventTime = Date.now();

  let x = 0;
  let y = 0;
  let z = 0;

  const now = Date.now();

  // 優先讀取不包含重力的線性加速度
  if (validXYZ(event.acceleration)) {
    x = event.acceleration.x;
    y = event.acceleration.y;
    z = event.acceleration.z;

    sensorStatus.textContent = "✅ 使用線性加速度（不含重力）";

  } else if (validXYZ(event.accelerationIncludingGravity)) {

    // 部分手機只提供包含重力的加速度
    // 使用低通濾波估算重力，再扣除重力
    const raw = event.accelerationIncludingGravity;

    const dt = lastSensorTime
      ? Math.max(0.005, Math.min((now - lastSensorTime) / 1000, 0.2))
      : 0.02;

    const alpha = 1 - Math.exp(-dt / 0.8);

    if (gravity === null) {
      gravity = {
        x: raw.x,
        y: raw.y,
        z: raw.z
      };
    } else {
      gravity.x += alpha * (raw.x - gravity.x);
      gravity.y += alpha * (raw.y - gravity.y);
      gravity.z += alpha * (raw.z - gravity.z);
    }

    x = raw.x - gravity.x;
    y = raw.y - gravity.y;
    z = raw.z - gravity.z;

    sensorStatus.textContent = "✅ 使用估算方式扣除重力";

  } else {
    sensorStatus.textContent = "❌ 手機沒有提供加速度資料";
    lastSensorTime = now;
    return;
  }

  lastSensorTime = now;

  const magnitude = Math.sqrt(x*x + y*y + z*z);

  // 顯示資料
  document.getElementById("ax").textContent = x.toFixed(2);
  document.getElementById("ay").textContent = y.toFixed(2);
  document.getElementById("az").textContent = z.toFixed(2);
  document.getElementById("magnitude").textContent = magnitude.toFixed(2);

  // 每 100ms 發布最新加速度
  if (!window.lastAccelPublish || now - window.lastAccelPublish >= 100) {
    publishAcceleration(x, y, z, magnitude);
    window.lastAccelPublish = now;
  }

  // 計步：平滑化加速度大小
  smoothMagnitude = smoothMagnitude * 0.65 + magnitude * 0.35;

  const threshold = getThreshold();

  // 當加速度超過門檻，而且已經重新準備好，就增加一步
  if (
    smoothMagnitude > threshold &&
    armed &&
    now - lastStepTime > 300
  ) {
    steps++;
    updateSteps();

    lastStepTime = now;
    armed = false;

    // 每一步立即發布
    publishStep("step");
  }

  // 加速度下降後重新準備偵測下一步
  if (smoothMagnitude < threshold * 0.55) {
    armed = true;
  }
}

// ========================================
// 開始計步
// ========================================

async function startTracking() {
  if (tracking) return;

  if (!window.isSecureContext) {
    alert("請使用 HTTPS 網址開啟網頁，例如 GitHub Pages。");
    return;
  }

  if (!("DeviceMotionEvent" in window)) {
    alert("這個瀏覽器不支援手機動作感測器。");
    return;
  }

  try {
    // iPhone Safari 必須由按鈕操作觸發權限請求
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      const permission = await DeviceMotionEvent.requestPermission();

      if (permission !== "granted") {
        alert("你沒有允許動作與方向感測器權限。");
        return;
      }
    }

    gravity = null;
    lastSensorTime = 0;
    smoothMagnitude = 0;
    armed = true;
    lastStepTime = 0;
    lastSensorEventTime = 0;

    window.addEventListener("devicemotion", handleMotion, true);

    tracking = true;

    trackingStatus.textContent = "目前狀態：計步中";
    sensorStatus.textContent = "等待手機感測器資料...";

    publishStep("start");

    // 每五秒發布一次目前步數
    clearInterval(publishTimer);

    publishTimer = setInterval(() => {
      if (tracking) {
        publishStep("step_count");
      }
    }, 5000);

    clearTimeout(sensorWarningTimer);

    sensorWarningTimer = setTimeout(() => {
      if (tracking && lastSensorEventTime === 0) {
        sensorStatus.textContent =
          "⚠️ 尚未收到感測器資料，請確認瀏覽器權限";
      }
    }, 3000);

  } catch (error) {
    console.error(error);
    alert("啟動感測器失敗：" + error.message);
  }
}

// ========================================
// 停止計步
// ========================================

function stopTracking() {
  if (!tracking) return;

  tracking = false;

  window.removeEventListener("devicemotion", handleMotion, true);

  clearInterval(publishTimer);
  clearTimeout(sensorWarningTimer);

  trackingStatus.textContent = "目前狀態：已停止";
  sensorStatus.textContent = "感測器已停止";

  publishStep("stop");
}

// ========================================
// 歸零
// ========================================

function resetSteps() {
  steps = 0;
  updateSteps();

  armed = true;
  lastStepTime = 0;
  smoothMagnitude = 0;

  publishStep("reset");
}

// 按鈕
document.getElementById("startBtn").addEventListener("click", startTracking);
document.getElementById("stopBtn").addEventListener("click", stopTracking);
document.getElementById("resetBtn").addEventListener("click", resetSteps);

// 初始畫面
updateSteps();

</script>

</body>
</html>
