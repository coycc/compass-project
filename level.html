
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手機水平儀 Pitch</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      text-align: center;
      background: #edf2f7;
      color: #243247;
    }

    .panel {
      max-width: 440px;
      margin: 15px auto;
      padding: 24px 16px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 6px 24px #24324718;
    }

    h1 {
      font-size: 26px;
    }

    .level {
      width: min(290px, 78vw);
      aspect-ratio: 1;
      margin: 28px auto;
      border: 8px solid #53677d;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle, #f8fff4 0%, #dcefd8 100%);
      box-shadow:
        inset 0 0 0 3px #ffffff,
        0 5px 12px #24324720;
    }

    .cross-h,
    .cross-v {
      position: absolute;
      background: #91a68d;
      opacity: 0.75;
    }

    .cross-h {
      width: 100%;
      height: 2px;
      top: 50%;
      left: 0;
    }

    .cross-v {
      height: 100%;
      width: 2px;
      left: 50%;
      top: 0;
    }

    .target {
      width: 54px;
      height: 54px;
      border: 2px solid #8eaa86;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #ball {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle at 30% 25%,
        #ffffff 0%,
        #72c7ff 18%,
        #2585e8 65%,
        #1554a0 100%
      );
      box-shadow: 0 3px 8px #164e8b66;
      transition: top 0.08s linear;
    }

    #pitch {
      font-size: 36px;
      font-weight: bold;
      margin: 8px;
    }

    #message {
      font-size: 20px;
      font-weight: bold;
      color: #25804a;
    }

    #status {
      font-size: 14px;
      color: #68778a;
      overflow-wrap: anywhere;
    }

    button {
      padding: 13px 22px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .hint {
      font-size: 13px;
      color: #718096;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1 id="title">手機水平儀</h1>
    <p id="status">準備連線……</p>

    <div class="level">
      <div class="cross-h"></div>
      <div class="cross-v"></div>
      <div class="target"></div>
      <div id="ball"></div>
    </div>

    <p>Pitch / 前後傾斜角</p>
    <div id="pitch">--°</div>
    <div id="message">等待感測器</div>

    <button id="startBtn">開始感測器</button>

    <p class="hint">
      將手機前後傾斜，觀察球的移動。<br>
      手機接近平放時，球會回到中央。
    </p>
  </div>

  <script>
    // =============================
    // 1. 基本設定
    // =============================

    const params = new URLSearchParams(location.search);
    const mode = params.get("mode") || "phone";

    const studentId = "1411331040";

    // 使用新的 pitch topic，避免與原本 yaw 指南針混在一起
    const topic = `nutc/im/${studentId}/compass/pitch`;

    const brokerUrl =
      "wss://broker.hivemq.com:8884/mqtt";

    const statusEl = document.getElementById("status");
    const pitchEl = document.getElementById("pitch");
    const messageEl = document.getElementById("message");
    const ball = document.getElementById("ball");
    const titleEl = document.getElementById("title");
    const startBtn = document.getElementById("startBtn");

    let client = null;
    let sensorStarted = false;

    // 球可以在中心上下移動的最大距離
    const maxMove = 85;

    // =============================
    // 2. 更新水平儀
    // =============================

    function updateLevel(pitch) {
      if (!Number.isFinite(pitch)) return;

      // 將角度限制在 -45 到 +45 度
      const limitedPitch = Math.max(
        -45,
        Math.min(45, pitch)
      );

      // 將角度換算成球的上下位置
      // 正負方向依手機實際擺放情況可再調整
      const offset = (limitedPitch / 45) * maxMove;

      ball.style.top = `calc(50% + ${offset}px)`;

      pitchEl.textContent = pitch.toFixed(1) + "°";

      if (Math.abs(pitch) < 3) {
        messageEl.textContent = "水平！";
        messageEl.style.color = "#25804a";
      } else if (pitch > 0) {
        messageEl.textContent = "向前後方向傾斜";
        messageEl.style.color = "#b7791f";
      } else {
        messageEl.textContent = "向相反方向傾斜";
        messageEl.style.color = "#b7791f";
      }
    }

    // =============================
    // 3. MQTT 連線
    // =============================

    function connectMQTT() {
      if (client) return;

      if (!window.mqtt) {
        statusEl.textContent =
          "MQTT 函式庫載入失敗，請檢查網路";
        return;
      }

      statusEl.textContent = "正在連接 MQTT……";

      client = mqtt.connect(brokerUrl, {
        clientId:
          "level_" + Math.random().toString(16).slice(2, 10),
        connectTimeout: 10000,
        reconnectPeriod: 3000,
        clean: true
      });

      client.on("connect", () => {
        if (mode === "pc") {
          client.subscribe(topic, (err) => {
            statusEl.textContent = err
              ? "訂閱失敗：" + err.message
              : "MQTT 已連線，等待手機 pitch";
          });
        } else {
          statusEl.textContent =
            "MQTT 已連線，請啟動感測器";
        }
      });

      client.on("reconnect", () => {
        statusEl.textContent = "MQTT 重新連線中……";
      });

      client.on("error", (err) => {
        statusEl.textContent =
          "MQTT 錯誤：" + err.message;
      });

      client.on("message", (receivedTopic, payload) => {
        if (receivedTopic !== topic) return;

        const pitch = Number(payload.toString());

        if (Number.isFinite(pitch)) {
          updateLevel(pitch);
          statusEl.textContent = "已接收手機 pitch";
        }
      });
    }

    // =============================
    // 4. 讀取手機 pitch
    // =============================

    async function startSensor() {
      if (mode !== "phone" || sensorStarted) return;

      if (!window.isSecureContext) {
        statusEl.textContent =
          "請透過 HTTPS 網址開啟網頁";
        return;
      }

      if (!("DeviceOrientationEvent" in window)) {
        statusEl.textContent =
          "此瀏覽器不支援方向感測器";
        return;
      }

      try {
        // iPhone Safari 必須由使用者操作觸發權限要求
        if (
          typeof DeviceOrientationEvent.requestPermission ===
          "function"
        ) {
          const permission =
            await DeviceOrientationEvent.requestPermission();

          if (permission !== "granted") {
            statusEl.textContent =
              "沒有取得方向感測器權限";
            return;
          }
        }

        window.addEventListener(
          "deviceorientation",
          handleOrientation
        );

        sensorStarted = true;
        startBtn.disabled = true;
        startBtn.textContent = "感測器已啟動";

        statusEl.textContent =
          "感測器已啟動，請前後傾斜手機";
      } catch (err) {
        statusEl.textContent =
          "啟動失敗：" + err.message;
      }
    }

    function handleOrientation(event) {
      // beta 是裝置前後傾斜角度
      if (!Number.isFinite(event.beta)) {
        statusEl.textContent =
          "沒有取得 pitch，請檢查感測器";
        return;
      }

      const pitch = event.beta;

      // 更新手機水平儀
      updateLevel(pitch);

      // 發布 pitch 給電腦
      if (client && client.connected) {
        client.publish(topic, pitch.toFixed(1));
      }
    }

    // =============================
    // 5. 手機與電腦模式
    // =============================

    if (mode === "pc") {
      titleEl.textContent = "電腦同步水平儀";
      startBtn.style.display = "none";
      messageEl.textContent = "等待手機資料";

      connectMQTT();
    } else {
      titleEl.textContent = "手機水平儀";

      connectMQTT();

      startBtn.addEventListener("click", startSensor);
    }
  </script>
</body>
</html>
