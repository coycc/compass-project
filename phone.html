<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手機加速度感測器</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, "Noto Sans TC", sans-serif;
  background: #101827;
  color: white;
}

.container {
  max-width: 550px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 26px;
}

.card {
  background: #1d2a40;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 16px;
}

.status {
  padding: 12px;
  border-radius: 9px;
  text-align: center;
  background: #34445e;
  margin-bottom: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.value-box {
  background: #293b58;
  border-radius: 10px;
  padding: 15px 5px;
  text-align: center;
}

.value {
  display: block;
  margin-top: 10px;
  font-size: 25px;
  font-weight: bold;
  color: #73c7ff;
  overflow-wrap: anywhere;
}

.total {
  text-align: center;
  font-size: 28px;
  color: #43e0a1;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #20bb80;
  color: white;
}

.stop {
  background: #e45d5d;
  color: white;
}

.reset {
  background: #e6a33b;
  color: white;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.small {
  color: #c3cee0;
  font-size: 13px;
  line-height: 1.7;
}

</style>
</head>

<body>

<div class="container">

  <h1>📱 手機加速度感測器</h1>

  <div class="card">
    <div class="status" id="mqttStatus">
      MQTT 正在連線...
    </div>

    <div class="status" id="sensorStatus">
      感測器尚未啟動
    </div>

    <p class="small">
      MQTT 主題：classroom/accelerometer/phone01
    </p>

    <p class="small">
      裝置 ID：phone01
    </p>
  </div>

  <div class="card">
    <h2>📊 X、Y、Z 加速度</h2>

    <div class="grid">

      <div class="value-box">
        X 軸
        <span class="value" id="x">0.00</span>
        <small>m/s²</small>
      </div>

      <div class="value-box">
        Y 軸
        <span class="value" id="y">0.00</span>
        <small>m/s²</small>
      </div>

      <div class="value-box">
        Z 軸
        <span class="value" id="z">0.00</span>
        <small>m/s²</small>
      </div>

    </div>

    <h3 style="text-align:center;">總加速度</h3>

    <div class="total">
      <span id="total">0.00</span> m/s²
    </div>

    <p class="small" id="source">
      感測器資料來源：尚未取得
    </p>
  </div>

  <div class="card">
    <h2>🎮 操作</h2>

    <button class="start" id="startBtn">
      ▶ 開始感測
    </button>

    <button class="stop" id="stopBtn" disabled>
      ⏸ 停止感測
    </button>

    <button class="reset" id="resetBtn">
      ↻ 重新校正重力
    </button>

    <p class="small" id="sendStatus">
      等待開始感測...
    </p>
  </div>

</div>

<script>

// =======================================
// 1. MQTT 設定
// =======================================

const MQTT_URL = "wss://broker.hivemq.com:8884/mqtt";

const TOPIC = "classroom/accelerometer/phone01";

const DEVICE_ID = "phone01";

let mqttClient = null;

let sensorRunning = false;
let starting = false;

let lastPublishTime = 0;
let lastSensorTime = 0;
let sensorReceived = false;

let gravity = null;

let sensorWarningTimer = null;

const mqttStatus = document.getElementById("mqttStatus");
const sensorStatus = document.getElementById("sensorStatus");
const sendStatus = document.getElementById("sendStatus");


// =======================================
// 2. MQTT 連線
// =======================================

function connectMQTT() {

  if (typeof mqtt === "undefined") {
    mqttStatus.textContent = "MQTT 程式載入失敗";
    return;
  }

  mqttClient = mqtt.connect(MQTT_URL, {
    clientId: "phone_accel_" + Math.random().toString(16).slice(2),
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000
  });

  mqttClient.on("connect", () => {
    mqttStatus.textContent = "✅ MQTT 已連線";
    mqttStatus.style.background = "#176b50";

    sendStatus.textContent = "已連接 MQTT，等待感測資料";
  });

  mqttClient.on("reconnect", () => {
    mqttStatus.textContent = "MQTT 正在重新連線...";
    mqttStatus.style.background = "#80642b";
  });

  mqttClient.on("offline", () => {
    mqttStatus.textContent = "MQTT 已離線";
    mqttStatus.style.background = "#803737";
  });

  mqttClient.on("error", (error) => {
    console.error("MQTT 錯誤：", error);

    mqttStatus.textContent = "MQTT 連線錯誤";
    mqttStatus.style.background = "#803737";
  });

}

connectMQTT();


// =======================================
// 3. MQTT 發布加速度
// =======================================

function publishAcceleration(x, y, z, total) {

  if (!mqttClient || !mqttClient.connected) {
    sendStatus.textContent = "感測器正常，但 MQTT 尚未連線";
    return;
  }

  const data = {
    x: Number(x.toFixed(3)),
    y: Number(y.toFixed(3)),
    z: Number(z.toFixed(3)),
    total: Number(total.toFixed(3)),
    device_id: DEVICE_ID,
    timestamp: new Date().toISOString(),
    unit: "m/s2"
  };

  mqttClient.publish(
    TOPIC,
    JSON.stringify(data),
    { qos: 0, retain: false },
    (error) => {
      if (error) {
        console.error("發布失敗：", error);
      }
    }
  );

  sendStatus.textContent = "✅ 正在傳送加速度資料";

}


// =======================================
// 4. 檢查 XYZ 是否有效
// =======================================

function validXYZ(value) {

  return value &&
    Number.isFinite(value.x) &&
    Number.isFinite(value.y) &&
    Number.isFinite(value.z);

}


// =======================================
// 5. 手機加速度感測
// =======================================

function handleMotion(event) {

  if (!sensorRunning) return;

  const now = Date.now();

  // 正確計算時間間隔
  const dt = lastSensorTime
    ? Math.max(
        0.005,
        Math.min((now - lastSensorTime) / 1000, 0.2)
      )
    : 0.02;

  lastSensorTime = now;
  sensorReceived = true;

  let x;
  let y;
  let z;

  // 優先使用不含重力的加速度
  if (validXYZ(event.acceleration)) {

    x = event.acceleration.x;
    y = event.acceleration.y;
    z = event.acceleration.z;

    document.getElementById("source").textContent =
      "資料來源：手機線性加速度（不含重力）";

  }

  // 如果沒有線性加速度，使用包含重力的資料來估算扣除
  else if (validXYZ(event.accelerationIncludingGravity)) {

    const raw = event.accelerationIncludingGravity;

    // 低通濾波估算重力
    const alpha = 1 - Math.exp(-dt / 0.8);

    if (gravity === null) {

      gravity = {
        x: raw.x,
        y: raw.y,
        z: raw.z
      };

    } else {

      gravity.x += alpha * (raw.x - gravity.x);
      gravity.y += alpha * (raw.y - gravity.y);
      gravity.z += alpha * (raw.z - gravity.z);

    }

    // 扣除估算的重力
    x = raw.x - gravity.x;
    y = raw.y - gravity.y;
    z = raw.z - gravity.z;

    document.getElementById("source").textContent =
      "資料來源：包含重力資料，已估算扣除重力";

  }

  else {

    sensorStatus.textContent =
      "❌ 手機沒有提供有效的加速度資料";

    return;

  }

  // 過濾微小雜訊
  const DEAD_ZONE = 0.05;

  if (Math.abs(x) < DEAD_ZONE) x = 0;
  if (Math.abs(y) < DEAD_ZONE) y = 0;
  if (Math.abs(z) < DEAD_ZONE) z = 0;

  // 計算總加速度
  const total = Math.sqrt(
    x*x + y*y + z*z
  );

  // 更新手機畫面
  document.getElementById("x").textContent = x.toFixed(2);
  document.getElementById("y").textContent = y.toFixed(2);
  document.getElementById("z").textContent = z.toFixed(2);

  document.getElementById("total").textContent =
    total.toFixed(2);

  sensorStatus.textContent = "✅ 手機感測器正常運作";

  // 每 100ms 發布一次 MQTT
  if (now - lastPublishTime >= 100) {

    publishAcceleration(x, y, z, total);

    lastPublishTime = now;

  }

}


// =======================================
// 6. 開始感測
// =======================================

async function startSensor() {

  if (sensorRunning || starting) return;

  if (!window.isSecureContext) {
    alert("請使用 HTTPS 網址開啟網頁，例如 GitHub Pages。");
    return;
  }

  if (!("DeviceMotionEvent" in window)) {
    alert("目前瀏覽器不支援手機動作感測器。");
    return;
  }

  starting = true;

  try {

    // iPhone Safari 需要使用者點擊按鈕後申請權限
    if (typeof DeviceMotionEvent.requestPermission === "function") {

      const permission =
        await DeviceMotionEvent.requestPermission();

      if (permission !== "granted") {
        alert("請允許動作與方向感測器權限。");
        return;
      }

    }

    // 重新初始化
    gravity = null;
    lastSensorTime = 0;
    lastPublishTime = 0;
    sensorReceived = false;

    window.addEventListener(
      "devicemotion",
      handleMotion,
      true
    );

    sensorRunning = true;

    sensorStatus.textContent = "感測器啟動中...";
    sendStatus.textContent = "正在等待手機感測器資料...";

    document.getElementById("startBtn").disabled = true;
    document.getElementById("stopBtn").disabled = false;

    clearTimeout(sensorWarningTimer);

    sensorWarningTimer = setTimeout(() => {

      if (sensorRunning && !sensorReceived) {

        sensorStatus.textContent =
          "⚠️ 尚未收到感測器資料，請確認權限或瀏覽器支援";

      }

    }, 4000);

  } catch (error) {

    console.error("感測器啟動失敗：", error);

    alert("感測器啟動失敗：" + error.message);

  } finally {

    starting = false;

  }

}


// =======================================
// 7. 停止感測
// =======================================

function stopSensor() {

  if (!sensorRunning) return;

  sensorRunning = false;

  window.removeEventListener(
    "devicemotion",
    handleMotion,
    true
  );

  clearTimeout(sensorWarningTimer);

  sensorStatus.textContent = "感測器已停止";
  sendStatus.textContent = "停止傳送加速度資料";

  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;

}


// =======================================
// 8. 重新校正重力
// =======================================

function recalibrate() {

  gravity = null;
  lastSensorTime = 0;

  sensorStatus.textContent =
    "已重新校正，請讓手機保持靜止約 2 秒";

}


// =======================================
// 9. 按鈕事件
// =======================================

document.getElementById("startBtn")
  .addEventListener("click", startSensor);

document.getElementById("stopBtn")
  .addEventListener("click", stopSensor);

document.getElementById("resetBtn")
  .addEventListener("click", recalibrate);

</script>

</body>
</html>
