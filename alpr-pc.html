
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電腦車牌辨識監控</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#101820;color:white;font-family:Arial,sans-serif}
h1{margin-top:0}
.panel{background:#1d2b36;border-radius:12px;padding:18px;margin-bottom:16px}
.status{color:#8ee7a1}
.warn{color:#ffd166}
.plate{font-size:42px;font-weight:bold;color:#ffe66d;letter-spacing:3px;word-break:break-all}
.info{font-size:16px;line-height:2;color:#dce6ed}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #45535e;text-align:left}
th{color:#9bd5ff}
#history{overflow-x:auto}
</style>
</head>
<body>
<h1>🚘 台灣車牌辨識監控系統</h1>

<div class="panel">
  MQTT 狀態：<span id="mqttStatus" class="warn">連線中…</span><br>
  訂閱主題：nutc/alpr/demo01/result
</div>

<div class="panel">
  <div>最新辨識車牌</div>
  <div id="plate" class="plate">等待手機辨識…</div>
  <div class="info">
    信心分數：<span id="confidence">--</span><br>
    手機設備：<span id="device">--</span><br>
    辨識時間：<span id="time">--</span><br>
    車牌框座標：<span id="bbox">--</span><br>
    原始影像尺寸：<span id="imageSize">--</span>
  </div>
</div>

<div class="panel">
  <h3>辨識紀錄</h3>
  <div id="history">
    <table>
      <thead>
        <tr>
          <th>時間</th>
          <th>車牌</th>
          <th>信心分數</th>
          <th>設備</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<script>
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
const TOPIC = "nutc/alpr/demo01/result";

const mqttClient = mqtt.connect(BROKER,{
  clientId:"alpr_pc_"+Math.random().toString(16).slice(2,10),
  clean:true,
  connectTimeout:10000,
  reconnectPeriod:3000
});

const statusEl = document.getElementById("mqttStatus");

mqttClient.on("connect",()=>{
  statusEl.textContent = "已連線";
  statusEl.className = "status";
  mqttClient.subscribe(TOPIC,{qos:0},err=>{
    if(err) {
      statusEl.textContent = "訂閱失敗";
      statusEl.className = "warn";
    }
  });
});

mqttClient.on("reconnect",()=>{
  statusEl.textContent = "重新連線中…";
  statusEl.className = "warn";
});

mqttClient.on("error",err=>{
  statusEl.textContent = "連線錯誤："+err.message;
  statusEl.className = "warn";
});

mqttClient.on("message",(topic,payload)=>{
  try {
    const data = JSON.parse(payload.toString());
    if(data.type !== "license_plate") return;

    document.getElementById("plate").textContent = data.plate || "--";
    document.getElementById("confidence").textContent =
      data.confidence != null ? data.confidence+"%" : "--";
    document.getElementById("device").textContent = data.deviceId || "--";

    const date = data.time ? new Date(data.time) : new Date();
    document.getElementById("time").textContent = date.toLocaleString("zh-TW");

    if(data.bbox) {
      const b = data.bbox;
      document.getElementById("bbox").textContent =
        `X:${b.x}, Y:${b.y}, 寬:${b.width}, 高:${b.height}`;
      document.getElementById("imageSize").textContent =
        `${b.imageWidth} × ${b.imageHeight}`;
    } else {
      document.getElementById("bbox").textContent = "--";
      document.getElementById("imageSize").textContent = "--";
    }

    const tr = document.createElement("tr");
    const values = [
      date.toLocaleTimeString("zh-TW"),
      data.plate || "--",
      data.confidence != null ? data.confidence+"%" : "--",
      data.deviceId || "--"
    ];

    values.forEach(value=>{
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    const body = document.getElementById("historyBody");
    body.prepend(tr);

    while(body.children.length > 50) {
      body.removeChild(body.lastChild);
    }
  } catch(err) {
    console.error("資料解析錯誤",err);
  }
});
</script>
</body>
</html>
