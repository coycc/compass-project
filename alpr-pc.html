
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>車牌辨識電腦監控端</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#0f172a;color:#f8fafc;font-family:Arial,"Microsoft JhengHei",sans-serif}
h1{margin-top:0}
.panel{background:#1e293b;padding:20px;border-radius:14px;margin-bottom:18px}
.status{font-size:14px;color:#cbd5e1}
#plate{font-size:48px;font-weight:bold;color:#facc15;letter-spacing:4px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.item{background:#0f172a;padding:14px;border-radius:10px;overflow-wrap:anywhere}
.label{font-size:13px;color:#94a3b8;margin-bottom:6px}
.value{font-size:18px;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px;text-align:left;border-bottom:1px solid #334155}
th{color:#94a3b8}
.history{overflow-x:auto}
.good{color:#4ade80}
.bad{color:#f87171}
</style>
</head>
<body>
<h1>🚘 車牌辨識即時監控系統</h1>

<div class="panel">
  <div class="status" id="connection">MQTT：連線中...</div>
  <div class="label" style="margin-top:18px">最新辨識車牌</div>
  <div id="plate">等待手機掃描</div>
  <div class="grid">
    <div class="item"><div class="label">信心分數</div><div class="value" id="confidence">--</div></div>
    <div class="item"><div class="label">辨識時間</div><div class="value" id="time">--</div></div>
    <div class="item"><div class="label">手機裝置</div><div class="value" id="device">--</div></div>
    <div class="item"><div class="label">接收筆數</div><div class="value" id="count">0</div></div>
  </div>
</div>

<div class="panel">
  <h3>📍 車牌框座標資訊</h3>
  <div class="grid">
    <div class="item"><div class="label">左上角 X</div><div class="value" id="x">--</div></div>
    <div class="item"><div class="label">左上角 Y</div><div class="value" id="y">--</div></div>
    <div class="item"><div class="label">右下角 X</div><div class="value" id="right">--</div></div>
    <div class="item"><div class="label">右下角 Y</div><div class="value" id="bottom">--</div></div>
  </div>
  <div class="status" id="raw" style="margin-top:14px">原始 OCR 文字：--</div>
</div>

<div class="panel">
  <h3>📋 辨識歷史紀錄</h3>
  <div class="history">
    <table>
      <thead>
        <tr><th>時間</th><th>車牌</th><th>信心分數</th><th>裝置</th></tr>
      </thead>
      <tbody id="history">
        <tr><td colspan="4">尚無辨識資料</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const TOPIC="nutc/alpr/demo01/result";
let count=0;
const connection=document.getElementById("connection");

const client=mqtt.connect("wss://broker.hivemq.com:8884/mqtt",{
  clientId:"alpr_pc_"+Math.random().toString(16).slice(2,10),
  clean:true,
  connectTimeout:10000,
  reconnectPeriod:3000
});

client.on("connect",()=>{
  connection.textContent="MQTT：已連線，正在接收手機辨識資料";
  connection.className="status good";
  client.subscribe(TOPIC,{qos:0},err=>{
    if(err){
      connection.textContent="訂閱失敗："+err.message;
      connection.className="status bad";
    }
  });
});

client.on("reconnect",()=>{
  connection.textContent="MQTT：重新連線中...";
  connection.className="status";
});

client.on("offline",()=>{
  connection.textContent="MQTT：目前離線";
  connection.className="status bad";
});

client.on("error",err=>{
  connection.textContent="MQTT 錯誤："+err.message;
  connection.className="status bad";
});

function show(id,value){
  document.getElementById(id).textContent=
    value===undefined || value===null || value==="" ? "--" : value;
}

client.on("message",(topic,message)=>{
  try{
    const data=JSON.parse(message.toString());
    if(data.type!=="license_plate") return;

    count++;
    show("plate",data.plate);
    show("confidence",Math.round(Number(data.confidence)||0)+"%");
    show("time",data.time ? new Date(data.time).toLocaleString() : "--");
    show("device",data.device_id);
    show("count",count);

    const b=data.bbox||{};
    show("x",b.x);
    show("y",b.y);
    show("right",b.w);
    show("bottom",b.h);
    show("raw",data.raw_text);

    const tbody=document.getElementById("history");
    if(count===1) tbody.innerHTML="";
    const tr=document.createElement("tr");
    [
      data.time ? new Date(data.time).toLocaleTimeString() : "--",
      data.plate||"--",
      Math.round(Number(data.confidence)||0)+"%",
      data.device_id||"--"
    ].forEach(value=>{
      const td=document.createElement("td");
      td.textContent=value;
      tr.appendChild(td);
    });
    tbody.prepend(tr);
    while(tbody.children.length>100){
      tbody.removeChild(tbody.lastChild);
    }
  }catch(err){
    console.error("資料解析失敗",err);
  }
});
</script>
</body>
</html>
