<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電腦即時加速度監控</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  font-family: Arial, "Noto Sans TC", sans-serif;
  background: #101827;
  color: white;
}

.container {
  max-width: 1100px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.card {
  background: #1d2a40;
  padding: 22px;
  border-radius: 15px;
  margin-bottom: 18px;
}

.status {
  padding: 12px;
  border-radius: 9px;
  background: #34445e;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.value-box {
  background: #293b58;
  padding: 18px 8px;
  border-radius: 10px;
  text-align: center;
}

.value {
  display: block;
  font-size: 28px;
  font-weight: bold;
  margin-top: 10px;
  color: #73c7ff;
  overflow-wrap: anywhere;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.info-box {
  background: #293b58;
  padding: 14px;
  border-radius: 10px;
}

.info-label {
  color: #b6c4da;
  font-size: 14px;
}

.info-value {
  font-size: 17px;
  font-weight: bold;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.chart-container {
  position: relative;
  height: 380px;
  width: 100%;
}

.small {
  font-size: 13px;
  line-height: 1.7;
  color: #b6c4da;
}

@media (max-width: 750px) {
  body {
    padding: 12px;
  }

  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .info-grid {
    grid-template-columns: 1fr;
  }

  .chart-container {
    height: 320px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>📊 手機即時加速度監控</h1>

  <div class="card">

    <div class="status" id="mqttStatus">
      MQTT 正在連線...
    </div>

    <p class="small">
      MQTT 主題：classroom/accelerometer/phone01
    </p>

    <p class="small">
      資料來源：手機 accelerometer
    </p>

  </div>

  <div class="card">

    <h2>📱 即時加速度數值</h2>

    <div class="grid">

      <div class="value-box">
        X 軸
        <span class="value" id="x">0.00</span>
        <small>m/s²</small>
      </div>

      <div class="value-box">
        Y 軸
        <span class="value" id="y">0.00</span>
        <small>m/s²</small>
      </div>

      <div class="value-box">
        Z 軸
        <span class="value" id="z">0.00</span>
        <small>m/s²</small>
      </div>

      <div class="value-box">
        總加速度
        <span class="value" id="total">0.00</span>
        <small>m/s²</small>
      </div>

    </div>

  </div>

  <div class="card">

    <h2>📋 裝置資訊</h2>

    <div class="info-grid">

      <div class="info-box">
        <div class="info-label">裝置 ID</div>
        <div class="info-value" id="deviceId">尚未收到</div>
      </div>

      <div class="info-box">
        <div class="info-label">最後更新時間</div>
        <div class="info-value" id="updateTime">尚未收到</div>
      </div>

    </div>

    <p class="small" id="dataStatus">
      等待手機資料...
    </p>

  </div>

  <div class="card">

    <h2>📈 加速度即時折線圖</h2>

    <div class="chart-container">
      <canvas id="accelerationChart"></canvas>
    </div>

    <p class="small">
      圖表顯示 X、Y、Z 與總加速度。
      只保留最新 100 筆資料。
    </p>

  </div>

</div>

<script>

// =======================================
// 1. MQTT 設定
// =======================================

const MQTT_URL = "wss://broker.hivemq.com:8884/mqtt";

const TOPIC = "classroom/accelerometer/phone01";

let mqttClient = null;
let lastMessageTime = 0;

const mqttStatus = document.getElementById("mqttStatus");
const dataStatus = document.getElementById("dataStatus");

function setMQTTStatus(message, color) {

  mqttStatus.textContent = message;
  mqttStatus.style.background = color;

}


// =======================================
// 2. 建立 Chart.js 圖表
// =======================================

const ctx = document
  .getElementById("accelerationChart")
  .getContext("2d");

let accelerationChart = null;

function createChart() {

  if (typeof Chart === "undefined") {

    dataStatus.textContent =
      "❌ Chart.js 載入失敗，請檢查網路";

    return;

  }

  accelerationChart = new Chart(ctx, {

    type: "line",

    data: {

      labels: [],

      datasets: [

        {
          label: "X 軸",
          data: [],
          borderColor: "#ff6384",
          backgroundColor: "rgba(255,99,132,0.1)",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        },

        {
          label: "Y 軸",
          data: [],
          borderColor: "#36a2eb",
          backgroundColor: "rgba(54,162,235,0.1)",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        },

        {
          label: "Z 軸",
          data: [],
          borderColor: "#4bc0c0",
          backgroundColor: "rgba(75,192,192,0.1)",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        },

        {
          label: "總加速度",
          data: [],
          borderColor: "#ffcd56",
          backgroundColor: "rgba(255,205,86,0.1)",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2
        }

      ]

    },

    options: {

      responsive: true,

      maintainAspectRatio: false,

      animation: false,

      interaction: {
        intersect: false,
        mode: "index"
      },

      plugins: {

        legend: {
          labels: {
            color: "#ffffff"
          }
        }

      },

      scales: {

        x: {
          ticks: {
            color: "#b6c4da",
            maxTicksLimit: 8
          },

          grid: {
            color: "rgba(255,255,255,0.08)"
          }
        },

        y: {
          title: {
            display: true,
            text: "加速度 m/s²",
            color: "#ffffff"
          },

          ticks: {
            color: "#b6c4da"
          },

          grid: {
            color: "rgba(255,255,255,0.08)"
          }
        }

      }

    }

  });

}

createChart();


// =======================================
// 3. 時間格式
// =======================================

function formatTime(timestamp) {

  const date = timestamp
    ? new Date(timestamp)
    : new Date();

  if (Number.isNaN(date.getTime())) {
    return "--";
  }

  return date.toLocaleString("zh-TW", {
    hour12: false
  });

}

function formatChartTime(timestamp) {

  const date = timestamp
    ? new Date(timestamp)
    : new Date();

  if (Number.isNaN(date.getTime())) {
    return new Date().toLocaleTimeString("zh-TW");
  }

  const time = date.toLocaleTimeString("zh-TW", {
    hour12: false
  });

  const ms = String(date.getMilliseconds()).padStart(3, "0");

  return time + "." + ms;

}


// =======================================
// 4. 更新數值與圖表
// =======================================

function updateAcceleration(data) {

  const x = Number(data.x);
  const y = Number(data.y);
  const z = Number(data.z);

  // 避免空值或錯誤資料
  if (
    data.x === null ||
    data.y === null ||
    data.z === null ||
    !Number.isFinite(x) ||
    !Number.isFinite(y) ||
    !Number.isFinite(z)
  ) {

    console.warn("收到無效加速度資料：", data);
    return;

  }

  let total = Number(data.total);

  if (!Number.isFinite(total)) {

    total = Math.sqrt(
      x*x + y*y + z*z
    );

  }

  // 顯示數值
  document.getElementById("x").textContent =
    x.toFixed(2);

  document.getElementById("y").textContent =
    y.toFixed(2);

  document.getElementById("z").textContent =
    z.toFixed(2);

  document.getElementById("total").textContent =
    total.toFixed(2);

  // 顯示裝置 ID
  document.getElementById("deviceId").textContent =
    data.device_id || "phone01";

  // 顯示時間
  document.getElementById("updateTime").textContent =
    formatTime(data.timestamp);

  dataStatus.textContent =
    "✅ 正在接收手機加速度資料";

  lastMessageTime = Date.now();

  // 更新折線圖
  if (!accelerationChart) return;

  const timeLabel = formatChartTime(data.timestamp);

  const chart = accelerationChart;

  chart.data.labels.push(timeLabel);

  chart.data.datasets[0].data.push(x);
  chart.data.datasets[1].data.push(y);
  chart.data.datasets[2].data.push(z);
  chart.data.datasets[3].data.push(total);

  // 只保留最新 100 筆
  while (chart.data.labels.length > 100) {

    chart.data.labels.shift();

    chart.data.datasets.forEach(dataset => {
      dataset.data.shift();
    });

  }

  chart.update("none");

}


// =======================================
// 5. MQTT 連線
// =======================================

function connectMQTT() {

  if (typeof mqtt === "undefined") {

    setMQTTStatus("MQTT 程式載入失敗", "#803737");
    return;

  }

  mqttClient = mqtt.connect(MQTT_URL, {

    clientId: "pc_accel_" + Math.random().toString(16).slice(2),

    clean: true,

    connectTimeout: 10000,

    reconnectPeriod: 3000

  });

  mqttClient.on("connect", () => {

    setMQTTStatus("✅ MQTT 已連線", "#176b50");

    mqttClient.subscribe(TOPIC, (error) => {

      if (error) {

        console.error("訂閱失敗：", error);

        setMQTTStatus("訂閱主題失敗", "#803737");

      } else {

        console.log("已訂閱主題：", TOPIC);

      }

    });

  });

  mqttClient.on("reconnect", () => {

    setMQTTStatus("MQTT 正在重新連線...", "#80642b");

  });

  mqttClient.on("offline", () => {

    setMQTTStatus("MQTT 已離線", "#803737");

  });

  mqttClient.on("error", (error) => {

    console.error("MQTT 錯誤：", error);

    setMQTTStatus("MQTT 發生錯誤", "#803737");

  });


  // =====================================
  // 6. 接收手機資料
  // =====================================

  mqttClient.on("message", (topic, payload) => {

    if (topic !== TOPIC) return;

    try {

      const data = JSON.parse(payload.toString());

      if (!data || typeof data !== "object") {
        throw new Error("資料格式不是物件");
      }

      updateAcceleration(data);

    } catch (error) {

      console.error("資料解析錯誤：", error);

    }

  });

}

connectMQTT();


// =======================================
// 7. 檢查資料是否中斷
// =======================================

setInterval(() => {

  if (lastMessageTime === 0) return;

  const elapsed = Date.now() - lastMessageTime;

  if (elapsed > 3000) {

    dataStatus.textContent =
      "⚠️ 超過 3 秒沒有收到新的加速度資料";

  }

}, 1000);

</script>

</body>
</html>
