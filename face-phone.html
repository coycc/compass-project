
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手機人臉辨識</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
body{font-family:Arial;background:#edf2f7;margin:0;padding:15px;color:#222}
.card{background:white;padding:15px;border-radius:12px;margin:12px auto;max-width:700px}
button{padding:12px 16px;border:0;border-radius:8px;background:#1769aa;color:white;margin:5px}
.red{background:#bd3434}
input{padding:10px;margin:6px;max-width:95%}
video{width:100%;display:block}
.stage{position:relative;background:#111;overflow:hidden;border-radius:10px}
.stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.status{background:#eef4fa;padding:10px;margin:7px 0;border-radius:7px}
.person{padding:8px;border-bottom:1px solid #ddd}
</style>
</head>
<body>

<div class="card">
<h2>手機即時人臉辨識系統</h2>
<div class="status" id="modelStatus">正在載入 AI 模型...</div>
<div class="status" id="mqttStatus">MQTT 連線中...</div>
<div class="status" id="cameraStatus">等待開啟後置鏡頭...</div>
</div>

<div class="card">
<h3>人員照片登錄</h3>
<input id="personName" placeholder="輸入人員姓名">
<br>
<input id="registerFiles" type="file" accept="image/*" multiple>
<br>
<button onclick="registerPerson()">登錄人員照片</button>
<div id="peopleList"></div>
</div>

<div class="card">
<h3>後置鏡頭即時辨識</h3>
<button onclick="startCamera()">開啟後置鏡頭</button>
<button class="red" onclick="stopCamera()">停止鏡頭</button>
<div class="stage">
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
</div>
</div>

<div class="card">
<h3>辨識設定</h3>
<label>辨識門檻：</label>
<input id="threshold" type="range" min="0.35" max="0.75" step="0.01" value="0.50">
<span id="thresholdValue">0.50</span>
</div>

<div class="card">
<h3>手機辨識紀錄</h3>
<div id="logs"></div>
</div>

<script>
const TOPIC='classroom/face-demo-2026/demo01';
const MODEL_URL='https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights';

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');

let modelsReady=false;
let mqttClient=null;
let people=[];
let cameraStream=null;
let timer=null;
let busy=false;
let lastPublish=0;

// 裝置 ID
let deviceId=localStorage.getItem('faceDeviceId');
if(!deviceId){
 deviceId='PHONE-'+Math.random().toString(36).slice(2,10);
 localStorage.setItem('faceDeviceId',deviceId);
}

// 記錄目前仍在鏡頭內的人，避免重複發布辨識事件
let activePeople={};

function status(id,msg){
 document.getElementById(id).textContent=msg;
}

function log(msg){
 const d=document.createElement('div');
 d.className='person';
 d.textContent=new Date().toLocaleTimeString()+' '+msg;
 document.getElementById('logs').prepend(d);
}

function publish(data){
 if(mqttClient&&mqttClient.connected){
  mqttClient.publish(TOPIC,JSON.stringify(data));
  return true;
 }
 return false;
}

function connectMQTT(){
 mqttClient=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{
  clientId:'face_'+Math.random().toString(16).slice(2),
  reconnectPeriod:3000,
  connectTimeout:15000
 });

 mqttClient.on('connect',()=>{
  status('mqttStatus','✅ MQTT 已連線');
  publish({
   type:'phone_status',
   deviceId,
   online:true,
   time:Date.now()
  });
 });

 mqttClient.on('reconnect',()=>{
  status('mqttStatus','MQTT 重新連線中...');
 });

 mqttClient.on('error',e=>{
  status('mqttStatus','MQTT 錯誤：'+e.message);
 });
}

function loadPeople(){
 try{
  people=JSON.parse(localStorage.getItem('facePeople')||'[]')
  .map(p=>({
   name:p.name,
   descriptors:p.descriptors.map(d=>new Float32Array(d))
  }));
 }catch(e){people=[]}
 showPeople();
}

function savePeople(){
 localStorage.setItem('facePeople',JSON.stringify(
  people.map(p=>({
   name:p.name,
   descriptors:p.descriptors.map(d=>Array.from(d))
  }))
 ));
 showPeople();
}

function showPeople(){
 const box=document.getElementById('peopleList');
 box.innerHTML='';
 if(!people.length){
  box.textContent='尚未登錄人員';
  return;
 }
 people.forEach((p,i)=>{
  const row=document.createElement('div');
  row.className='person';
  const label=document.createElement('span');
  label.textContent=p.name+'（'+p.descriptors.length+'張）';
  const btn=document.createElement('button');
  btn.className='red';
  btn.textContent='刪除';
  btn.onclick=()=>{
   people.splice(i,1);
   savePeople();
  };
  row.append(label,btn);
  box.append(row);
 });
}

async function registerPerson(){
 if(!modelsReady){alert('AI 模型尚未載入');return}

 const name=document.getElementById('personName').value.trim();
 const files=[...document.getElementById('registerFiles').files];

 if(!name||!files.length){
  alert('請輸入姓名並選擇照片');
  return;
 }

 const descriptors=[];

 for(const file of files){
  try{
   const img=await faceapi.bufferToImage(file);
   const result=await faceapi.detectSingleFace(
    img,new faceapi.TinyFaceDetectorOptions()
   ).withFaceLandmarks().withFaceDescriptor();

   if(result)descriptors.push(result.descriptor);
  }catch(e){console.error(e)}
 }

 if(!descriptors.length){
  alert('照片中沒有偵測到人臉');
  return;
 }

 let person=people.find(p=>p.name===name);
 if(person)person.descriptors.push(...descriptors);
 else people.push({name,descriptors});

 savePeople();
 alert('成功登錄 '+name);
 log('登錄人員：'+name);
}

function identify(descriptor){
 let bestName='未知人員';
 let bestDistance=Infinity;

 for(const p of people){
  for(const known of p.descriptors){
   const distance=faceapi.euclideanDistance(descriptor,known);
   if(distance<bestDistance){
    bestDistance=distance;
    bestName=p.name;
   }
  }
 }

 const threshold=Number(document.getElementById('threshold').value);
 return {
  name:bestDistance<=threshold?bestName:'未知人員',
  recognized:bestDistance<=threshold,
  distance:Number.isFinite(bestDistance)?bestDistance:null
 };
}

function drawFaces(faces,w,h){
 canvas.width=w;
 canvas.height=h;
 const ctx=canvas.getContext('2d');
 ctx.clearRect(0,0,w,h);

 faces.forEach(f=>{
  const b=f.bbox;
  const x=b.x*w,y=b.y*h,bw=b.width*w,bh=b.height*h;

  ctx.strokeStyle=f.recognized?'#00e676':'#ff3333';
  ctx.lineWidth=Math.max(3,w/250);
  ctx.strokeRect(x,y,bw,bh);

  ctx.font='bold '+Math.max(16,w/35)+'px Arial';
  const label=f.name;
  const tw=ctx.measureText(label).width;
  ctx.fillStyle=f.recognized?'#168b48':'#bd3434';
  ctx.fillRect(x,Math.max(0,y-30),tw+14,28);
  ctx.fillStyle='white';
  ctx.fillText(label,x+7,Math.max(20,y-9));
 });
}

function sendEvent(face){
 const now=Date.now();
 publish({
  type:'face_event',
  deviceId,
  name:face.name,
  recognized:true,
  recognizedAt:now,
  distance:face.distance,
  bbox:face.bbox
 });
 log('辨識到：'+face.name);
}

function handleDetections(detections){
 const w=video.videoWidth;
 const h=video.videoHeight;
 const now=Date.now();

 const faces=detections.map(d=>{
  const b=d.detection.box;
  const result=identify(d.descriptor);
  return {
   name:result.name,
   recognized:result.recognized,
   distance:result.distance,
   bbox:{
    x:b.x/w,
    y:b.y/h,
    width:b.width/w,
    height:b.height/h
   }
  };
 });

 // 同一個人持續出現在畫面中，只發送一次辨識事件
 const seenNow={};

 faces.forEach(face=>{
  if(!face.recognized)return;

  seenNow[face.name]=true;

  if(!activePeople[face.name]){
   sendEvent(face);
  }

  activePeople[face.name]=now;
 });

 // 人離開畫面超過 3 秒，之後再次出現才重新記錄
 Object.keys(activePeople).forEach(name=>{
  if(!seenNow[name]&&now-activePeople[name]>3000){
   delete activePeople[name];
  }
 });

 drawFaces(faces,w,h);

 // 即時畫面資料持續傳送，讓 PC 更新外框
 if(now-lastPublish>=500){
  publish({
   type:'face_results',
   deviceId,
   faces,
   faceCount:faces.length,
   frame:{width:w,height:h},
   timestamp:now
  });
  lastPublish=now;
 }
}

async function startCamera(){
 if(!modelsReady){
  alert('請等待 AI 模型載入成功');
  return;
 }

 if(cameraStream)return;

 try{
  status('cameraStatus','正在啟動後置鏡頭...');

  // 優先使用後置鏡頭
  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:{ideal:'environment'},
    width:{ideal:1280},
    height:{ideal:720}
   },
   audio:false
  });

  video.srcObject=cameraStream;
  await video.play();

  status('cameraStatus','✅ 後置鏡頭已開啟，開始辨識');

  timer=setInterval(async()=>{
   if(busy||!video.videoWidth)return;
   busy=true;

   try{
    const detections=await faceapi.detectAllFaces(
     video,new faceapi.TinyFaceDetectorOptions({
      inputSize:416,
      scoreThreshold:0.35
     })
    ).withFaceLandmarks().withFaceDescriptors();

    handleDetections(detections);
    status('cameraStatus','後置鏡頭運作中｜偵測到 '+detections.length+' 張人臉');
   }catch(e){
    console.error(e);
   }finally{
    busy=false;
   }
  },300);

 }catch(e){
  cameraStream=null;
  status('cameraStatus','攝影機開啟失敗：'+e.message);
  alert('無法開啟後置鏡頭。請確認 Safari 相機權限，然後再按一次開啟。');
 }
}

function stopCamera(){
 if(timer){
  clearInterval(timer);
  timer=null;
 }
 if(cameraStream){
  cameraStream.getTracks().forEach(t=>t.stop());
  cameraStream=null;
 }
 video.srcObject=null;
 canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
 status('cameraStatus','攝影機已停止');
 publish({type:'phone_status',deviceId,online:false,time:Date.now()});
}

document.getElementById('threshold').addEventListener('input',e=>{
 document.getElementById('thresholdValue').textContent=
 Number(e.target.value).toFixed(2);
});

connectMQTT();
loadPeople();

(async()=>{
 try{
  await loadScript('https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js');

  status('modelStatus','正在載入人臉辨識模型...');

  await Promise.all([
   faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
   faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
   faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
  ]);

  modelsReady=true;
  status('modelStatus','✅ AI 模型載入成功');

  // 嘗試自動啟動後置鏡頭
  setTimeout(()=>startCamera(),500);

 }catch(e){
  console.error(e);
  status('modelStatus','❌ AI 模型載入失敗，請檢查網路');
 }
})();

window.addEventListener('pagehide',()=>{
 if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());
});
</script>
</body>
</html>
