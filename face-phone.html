
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 人臉辨識系統</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 font-family:Arial,sans-serif;
 background:#edf2f7;
 margin:0;padding:15px;color:#222
}
main{max-width:850px;margin:auto}
.card{
 background:white;padding:16px;border-radius:12px;
 margin-bottom:14px;box-shadow:0 3px 12px #0001
}
h2{font-size:19px;margin-top:0}
button{
 padding:11px 15px;border:0;border-radius:8px;
 background:#1769aa;color:white;margin:5px;font-size:15px
}
.red{background:#bd3434}
input{padding:10px;margin:6px;max-width:95%}
.status{
 padding:11px;background:#eef4fa;
 border-radius:8px;margin:8px 0;overflow-wrap:anywhere
}
.stage{
 position:relative;background:#111;
 border-radius:10px;overflow:hidden;width:100%
}
video{width:100%;height:auto;display:block}
canvas{
 position:absolute;left:0;top:0;
 width:100%;height:100%;pointer-events:none
}
.person{
 padding:9px;border-bottom:1px solid #ddd;
 display:flex;justify-content:space-between;gap:8px
}
.green{color:#138b45}
.redText{color:#c22}
</style>
</head>

<body>
<main>

<div class="card">
<h2>AI 人臉辨識系統</h2>
<div class="status" id="libStatus">等待載入程式庫...</div>
<div class="status" id="modelStatus">等待載入 AI 模型...</div>
<div class="status" id="mqttStatus">MQTT 連線中...</div>
<div class="status" id="cameraStatus">等待攝影機...</div>
<div class="status" id="detectStatus">等待人臉偵測...</div>
</div>

<div class="card">
<h2>一、人員照片登錄</h2>
<input id="personName" placeholder="輸入人員姓名">
<br>
<input id="registerFiles" type="file" accept="image/*" multiple>
<br>
<button onclick="registerPerson()">登錄人員照片</button>
<div id="peopleList"></div>
</div>

<div class="card">
<h2>二、後置鏡頭即時辨識</h2>
<button onclick="startCamera()">開啟後置鏡頭</button>
<button class="red" onclick="stopCamera()">停止鏡頭</button>
<div class="stage">
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
</div>
</div>

<div class="card">
<h2>三、照片辨識測試</h2>
<input id="testFile" type="file" accept="image/*">
<br>
<button onclick="recognizePhoto()">辨識照片</button>
<div id="photoResult"></div>
</div>

<div class="card">
<h2>四、辨識設定</h2>
<label>偵測靈敏度：</label>
<input id="sensitivity" type="range"
 min="0.05" max="0.50" step="0.05" value="0.15">
<span id="sensitivityValue">0.15</span>
<br>
<label>姓名比對門檻：</label>
<input id="threshold" type="range"
 min="0.35" max="0.75" step="0.01" value="0.50">
<span id="thresholdValue">0.50</span>
</div>

<div class="card">
<h2>五、辨識紀錄</h2>
<button class="red" onclick="clearLogs()">清除紀錄</button>
<div id="logs"></div>
</div>

</main>

<script>
/* =========================
   系統設定
========================= */

const TOPIC='classroom/face-demo-2026/demo01';

const LIBRARIES=[
 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js',
 'https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js'
];

const MODEL_URLS=[
 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights',
 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights'
];

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');

let modelsReady=false;
let mqttClient=null;
let people=[];
let cameraStream=null;
let cameraTimer=null;
let busy=false;
let lastPublish=0;
let activePeople={};

let deviceId=localStorage.getItem('faceDeviceId');

if(!deviceId){
 deviceId='PHONE-'+Math.random().toString(36).slice(2,10);
 localStorage.setItem('faceDeviceId',deviceId);
}

/* =========================
   狀態
========================= */

function status(id,message){
 document.getElementById(id).textContent=message;
}

function log(message){
 const div=document.createElement('div');
 div.className='person';
 div.textContent=new Date().toLocaleTimeString()+'　'+message;
 document.getElementById('logs').prepend(div);
}

function clearLogs(){
 document.getElementById('logs').innerHTML='';
}

/* =========================
   載入 face-api.js
========================= */

function loadScript(url){
 return new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src=url;
  script.async=true;

  script.onload=()=>{
   if(typeof faceapi!=='undefined'){
    resolve(true);
   }else{
    reject(new Error('找不到 faceapi'));
   }
  };

  script.onerror=()=>{
   reject(new Error('下載失敗：'+url));
  };

  document.head.appendChild(script);
 });
}

async function loadFaceApi(){
 if(typeof faceapi!=='undefined')return true;

 for(let i=0;i<LIBRARIES.length;i++){
  try{
   status('libStatus','載入 AI 程式庫 '+(i+1)+'/'+LIBRARIES.length);
   await loadScript(LIBRARIES[i]);
   status('libStatus','✅ AI 程式庫載入成功');
   return true;
  }catch(e){
   console.warn(e);
  }
 }

 status('libStatus','❌ AI 程式庫載入失敗');
 return false;
}

/* =========================
   AI 模型載入
========================= */

async function loadModel(net,label){
 let lastError=null;

 for(let i=0;i<MODEL_URLS.length;i++){
  try{
   status('modelStatus',
    '正在載入 '+label+'，來源 '+(i+1));

   await net.loadFromUri(MODEL_URLS[i]);

   console.log(label+' 載入成功');
   return true;

  }catch(e){
   console.error(label+' 下載失敗：',e);
   lastError=e;
  }
 }

 throw new Error(label+' 失敗：'+
  (lastError?.message||'無法下載模型'));
}

async function loadAllModels(){
 await loadModel(
  faceapi.nets.tinyFaceDetector,
  '人臉偵測模型'
 );

 await loadModel(
  faceapi.nets.faceLandmark68Net,
  '人臉特徵點模型'
 );

 await loadModel(
  faceapi.nets.faceRecognitionNet,
  '人臉辨識模型'
 );

 modelsReady=true;
 status('modelStatus','✅ 三個 AI 模型全部載入成功');
 log('AI 模型載入成功');
}

/* =========================
   MQTT
========================= */

function connectMQTT(){
 if(typeof mqtt==='undefined'){
  status('mqttStatus','❌ MQTT 程式庫載入失敗');
  return;
 }

 mqttClient=mqtt.connect(
  'wss://broker.hivemq.com:8884/mqtt',
  {
   clientId:'facePhone_'+Math.random().toString(16).slice(2),
   clean:true,
   connectTimeout:15000,
   reconnectPeriod:3000
  }
 );

 mqttClient.on('connect',()=>{
  status('mqttStatus','✅ MQTT 已連線');

  publish({
   type:'phone_status',
   deviceId,
   online:true,
   time:Date.now()
  });
 });

 mqttClient.on('reconnect',()=>{
  status('mqttStatus','MQTT 重新連線中...');
 });

 mqttClient.on('offline',()=>{
  status('mqttStatus','MQTT 離線');
 });

 mqttClient.on('error',e=>{
  status('mqttStatus','MQTT 錯誤：'+e.message);
 });
}

function publish(data){
 if(!mqttClient||!mqttClient.connected)return false;

 mqttClient.publish(TOPIC,JSON.stringify(data));
 return true;
}

/* =========================
   人員資料
========================= */

function loadPeople(){
 try{
  people=JSON.parse(localStorage.getItem('facePeople')||'[]')
   .map(p=>({
    name:p.name,
    descriptors:(p.descriptors||[])
     .map(d=>new Float32Array(d))
   }));
 }catch(e){
  people=[];
 }
 showPeople();
}

function savePeople(){
 localStorage.setItem('facePeople',JSON.stringify(
  people.map(p=>({
   name:p.name,
   descriptors:p.descriptors.map(d=>Array.from(d))
  }))
 ));
 showPeople();
}

function showPeople(){
 const box=document.getElementById('peopleList');
 box.innerHTML='';

 if(!people.length){
  box.textContent='目前沒有登錄人員';
  return;
 }

 people.forEach((p,i)=>{
  const row=document.createElement('div');
  row.className='person';

  const name=document.createElement('span');
  name.textContent=p.name+'（'+p.descriptors.length+' 張照片）';

  const btn=document.createElement('button');
  btn.className='red';
  btn.textContent='刪除';

  btn.onclick=()=>{
   people.splice(i,1);
   savePeople();
   log('刪除人員：'+p.name);
  };

  row.append(name,btn);
  box.append(row);
 });
}

async function descriptorFromImage(img){
 const result=await faceapi.detectSingleFace(
  img,
  new faceapi.TinyFaceDetectorOptions({
   inputSize:608,
   scoreThreshold:0.15
  })
 ).withFaceLandmarks().withFaceDescriptor();

 return result?result.descriptor:null;
}

async function registerPerson(){
 if(!modelsReady){
  alert('AI 模型尚未載入完成');
  return;
 }

 const name=document.getElementById('personName').value.trim();
 const files=[...document.getElementById('registerFiles').files];

 if(!name||!files.length){
  alert('請輸入姓名並選擇照片');
  return;
 }

 const descriptors=[];

 for(const file of files){
  try{
   const img=await faceapi.bufferToImage(file);
   const d=await descriptorFromImage(img);
   if(d)descriptors.push(d);
  }catch(e){
   console.error(e);
  }
 }

 if(!descriptors.length){
  alert('照片中沒有偵測到人臉，請使用清楚的正面照片');
  return;
 }

 let person=people.find(p=>p.name===name);

 if(person){
  person.descriptors.push(...descriptors);
 }else{
  people.push({name,descriptors});
 }

 savePeople();
 log('登錄成功：'+name);
 alert('登錄成功：'+name);
}

/* =========================
   人臉姓名比對
========================= */

function identify(descriptor){
 let bestName='未知人員';
 let bestDistance=Infinity;

 for(const p of people){
  for(const known of p.descriptors){
   const distance=faceapi.euclideanDistance(descriptor,known);

   if(distance<bestDistance){
    bestDistance=distance;
    bestName=p.name;
   }
  }
 }

 const threshold=Number(
  document.getElementById('threshold').value
 );

 return {
  name:bestDistance<=threshold?bestName:'未知人員',
  recognized:bestDistance<=threshold,
  distance:Number.isFinite(bestDistance)?
   Number(bestDistance.toFixed(4)):null
 };
}

/* =========================
   繪製外框
========================= */

function drawFaces(target,faces,width,height){
 target.width=width;
 target.height=height;

 const ctx=target.getContext('2d');
 ctx.clearRect(0,0,width,height);

 faces.forEach(face=>{
  const b=face.bbox;
  const x=b.x*width;
  const y=b.y*height;
  const w=b.width*width;
  const h=b.height*height;

  ctx.strokeStyle=face.recognized?'#00e676':'#ff3333';
  ctx.lineWidth=Math.max(3,width/250);
  ctx.strokeRect(x,y,w,h);

  ctx.font='bold '+Math.max(16,width/35)+'px Arial';

  const tw=ctx.measureText(face.name).width;

  ctx.fillStyle=face.recognized?'#168b48':'#bd3434';
  ctx.fillRect(x,Math.max(0,y-30),tw+14,28);

  ctx.fillStyle='white';
  ctx.fillText(face.name,x+7,Math.max(20,y-9));
 });
}

/* =========================
   發布辨識事件
========================= */

function sendEvent(face){
 const now=Date.now();

 publish({
  type:'face_event',
  deviceId,
  name:face.name,
  recognized:true,
  recognizedAt:now,
  distance:face.distance,
  bbox:face.bbox
 });

 log('辨識到：'+face.name);
}

/* =========================
   處理人臉偵測結果
========================= */

function handleDetections(detections){
 const width=video.videoWidth;
 const height=video.videoHeight;
 const now=Date.now();

 const faces=detections.map(d=>{
  const b=d.detection.box;
  const result=identify(d.descriptor);

  return {
   name:result.name,
   recognized:result.recognized,
   distance:result.distance,
   bbox:{
    x:b.x/width,
    y:b.y/height,
    width:b.width/width,
    height:b.height/height
   }
  };
 });

 // 顯示所有偵測到的人臉，包含未知人員
 drawFaces(canvas,faces,width,height);

 status('detectStatus',
  faces.length>0
   ? '🟢 已偵測到 '+faces.length+' 張人臉'
   : '🔍 正在搜尋人臉，請靠近鏡頭');

 const seenNow={};

 faces.forEach(face=>{
  if(!face.recognized)return;

  seenNow[face.name]=true;

  if(!activePeople[face.name]){
   sendEvent(face);
  }

  activePeople[face.name]=now;
 });

 // 離開畫面超過 3 秒，才允許再次記錄
 Object.keys(activePeople).forEach(name=>{
  if(!seenNow[name]&&now-activePeople[name]>3000){
   delete activePeople[name];
  }
 });

 // 傳送外框資料給 PC
 if(now-lastPublish>=500){
  publish({
   type:'face_results',
   deviceId,
   faces,
   faceCount:faces.length,
   frame:{width,height},
   timestamp:now
  });

  lastPublish=now;
 }
}

/* =========================
   照片辨識
========================= */

async function recognizePhoto(){
 if(!modelsReady){
  alert('AI 模型尚未載入');
  return;
 }

 const file=document.getElementById('testFile').files[0];

 if(!file){
  alert('請先選擇照片');
  return;
 }

 try{
  const img=await faceapi.bufferToImage(file);

  const detections=await faceapi.detectAllFaces(
   img,
   new faceapi.TinyFaceDetectorOptions({
    inputSize:608,
    scoreThreshold:0.15
   })
  ).withFaceLandmarks().withFaceDescriptors();

  const faces=detections.map(d=>{
   const b=d.detection.box;
   const result=identify(d.descriptor);

   return {
    name:result.name,
    recognized:result.recognized,
    distance:result.distance,
    bbox:{
     x:b.x/img.naturalWidth,
     y:b.y/img.naturalHeight,
     width:b.width/img.naturalWidth,
     height:b.height/img.naturalHeight
    }
   };
  });

  const box=document.getElementById('photoResult');
  box.innerHTML='';

  const stage=document.createElement('div');
  stage.className='stage';

  const c=document.createElement('canvas');
  const image=document.createElement('img');

  image.src=img.src;
  image.style.width='100%';
  image.style.display='block';

  c.style.position='absolute';
  c.style.left='0';
  c.style.top='0';
  c.style.width='100%';
  c.style.height='100%';

  stage.append(image,c);
  box.append(stage);

  drawFaces(c,faces,img.naturalWidth,img.naturalHeight);

  status('detectStatus',
   '照片辨識完成，找到 '+faces.length+' 張人臉');

  log('照片辨識完成：'+faces.length+' 張人臉');

 }catch(e){
  console.error(e);
  alert('照片辨識失敗：'+e.message);
 }
}

/* =========================
   後置鏡頭
========================= */

async function startCamera(){
 if(!modelsReady){
  alert('請等待 AI 模型載入完成');
  return;
 }

 if(cameraStream)return;

 try{
  status('cameraStatus','正在要求後置鏡頭權限...');

  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:{ideal:'environment'},
    width:{ideal:1280},
    height:{ideal:720}
   },
   audio:false
  });

  video.srcObject=cameraStream;
  await video.play();

  const track=cameraStream.getVideoTracks()[0];
  console.log('目前攝影機設定：',track.getSettings());

  status('cameraStatus','✅ 攝影機已開啟');

  cameraTimer=setInterval(async()=>{
   if(busy||!video.videoWidth)return;

   busy=true;

   try{
    const sensitivity=Number(
     document.getElementById('sensitivity').value
    );

    const detections=await faceapi.detectAllFaces(
     video,
     new faceapi.TinyFaceDetectorOptions({
      inputSize:608,
      scoreThreshold:sensitivity
     })
    ).withFaceLandmarks().withFaceDescriptors();

    handleDetections(detections);

   }catch(e){
    console.error('人臉偵測錯誤：',e);
    status('detectStatus','❌ 偵測錯誤：'+e.message);
   }finally{
    busy=false;
   }
  },400);

  log('後置鏡頭啟動成功');

 }catch(e){
  cameraStream=null;
  status('cameraStatus','❌ 鏡頭開啟失敗：'+e.message);
  alert('無法開啟攝影機，請檢查 Safari 相機權限');
 }
}

function stopCamera(){
 if(cameraTimer){
  clearInterval(cameraTimer);
  cameraTimer=null;
 }

 if(cameraStream){
  cameraStream.getTracks().forEach(t=>t.stop());
  cameraStream=null;
 }

 video.srcObject=null;

 canvas.getContext('2d').clearRect(
  0,0,canvas.width,canvas.height
 );

 status('cameraStatus','攝影機已停止');
 status('detectStatus','等待攝影機啟動');

 activePeople={};

 publish({
  type:'phone_status',
  deviceId,
  online:false,
  time:Date.now()
 });
}

/* =========================
   滑桿設定
========================= */

document.getElementById('sensitivity').addEventListener(
 'input',e=>{
  document.getElementById('sensitivityValue').textContent=
   Number(e.target.value).toFixed(2);
 }
);

document.getElementById('threshold').addEventListener(
 'input',e=>{
  document.getElementById('thresholdValue').textContent=
   Number(e.target.value).toFixed(2);
 }
);

/* =========================
   啟動系統
========================= */

connectMQTT();
loadPeople();

async function initialize(){
 const ok=await loadFaceApi();

 if(!ok)return;

 try{
  await loadAllModels();

  status('cameraStatus','AI 模型完成，準備開啟後置鏡頭');

  setTimeout(()=>{
   startCamera();
  },500);

 }catch(e){
  console.error(e);
  status('modelStatus','❌ '+e.message);
  log('模型載入失敗：'+e.message);
 }
}

initialize();

window.addEventListener('pagehide',()=>{
 if(cameraTimer)clearInterval(cameraTimer);

 if(cameraStream){
  cameraStream.getTracks().forEach(t=>t.stop());
 }
});
</script>
</body>
</html>
